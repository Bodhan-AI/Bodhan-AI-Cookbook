# Tooling config only (dependencies are in requirements.txt). Same Ruff rules as the Bodhan AI Cookbook repo.
[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["venv", "data"]

[tool.ruff.lint]
# pycodestyle errors, Pyflakes, import order, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]

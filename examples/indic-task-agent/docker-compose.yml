version: "3.8"

networks:
  bodhan-net:
    driver: bridge

services:
  gateway:
    image: nginx:alpine
    container_name: bodhan-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - transcribe-srv
      - translate-srv
      - speak-srv
      - ocr-srv
    networks:
      - bodhan-net

  transcribe-srv:
    build:
      context: ./services/transcribe
      dockerfile: Dockerfile
    container_name: bodhan-transcribe
    restart: unless-stopped
    environment:
      - MODEL_DIR=/models/indic-transcribe-core
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models/indic-transcribe-core:/models/indic-transcribe-core:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - bodhan-net

  translate-srv:
    build:
      context: ./services/translate
      dockerfile: Dockerfile
    container_name: bodhan-translate
    restart: unless-stopped
    environment:
      - MODEL_DIR=/models/indic-translate
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models/indic-translate:/models/indic-translate:ro
      - ./services/translate/app.py:/app/app.py:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - bodhan-net

  speak-srv:
    build:
      context: ./services/speak
      dockerfile: Dockerfile
    container_name: bodhan-speak
    restart: unless-stopped
    environment:
      - MODEL_DIR=/models/indic-speak
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models/indic-speak:/models/indic-speak:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - bodhan-net

  ocr-srv:
    build:
      context: ./services/ocr
      dockerfile: Dockerfile
    container_name: bodhan-ocr
    restart: unless-stopped
    environment:
      - MODEL_DIR=/models/indic-ocr
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models/indic-ocr:/models/indic-ocr:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - bodhan-net

  llm-srv:
    image: vllm/vllm-openai:latest
    container_name: bodhan-llm
    restart: unless-stopped
    ipc: host
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: >
      Qwen/Qwen2.5-7B-Instruct
      --port 8005
      --gpu-memory-utilization 0.30
      --max-model-len 8192
      --enable-auto-tool-choice
      --tool-call-parser hermes
    ports:
      - "8005:8005"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - bodhan-net

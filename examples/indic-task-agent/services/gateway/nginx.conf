events {
    worker_connections 1024;
}

http {
    client_max_body_size 100M;
    proxy_read_timeout 600s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;

    upstream transcribe_backend {
        server transcribe-srv:8001;
    }

    upstream translate_backend {
        server translate-srv:8002;
    }

    upstream speak_backend {
        server speak-srv:8003;
    }

    upstream ocr_backend {
        server ocr-srv:8004;
    }

    server {
        listen 8000;
        server_name localhost;

        # Speech-to-text
        location /v1/audio/transcriptions {
            proxy_pass http://transcribe_backend/v1/audio/transcriptions;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Translation
        location /v1/chat/completions {
            proxy_pass http://translate_backend/v1/chat/completions;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /v1/translations {
            proxy_pass http://translate_backend/v1/translations;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Text-to-speech
        location /v1/audio/speech {
            proxy_pass http://speak_backend/v1/audio/speech;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Document OCR
        location /v1/ocr {
            proxy_pass http://ocr_backend/v1/ocr;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Models list endpoint
        location /v1/models {
            default_type application/json;
            return 200 '{"object":"list","data":[{"id":"indic-transcribe-core","object":"model"},{"id":"indic-translate","object":"model"},{"id":"indic-speak","object":"model"},{"id":"indic-ocr","object":"model"}]}';
        }

        # Gateway health
        location /health {
            default_type application/json;
            return 200 '{"status":"healthy","gateway":"bodhan-local-nginx","port":8000}';
        }
    }
}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-agent"
version = "0.1.0"
description = "MCP Tool Server and Task Agent for Bodhan Indic AI models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "openai>=1.30.0",
    "soundfile>=0.12.1",
    "PyMuPDF>=1.24.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--ignore=tests/test_autodetect_lang.py --ignore=tests/test_table_ocr.py"

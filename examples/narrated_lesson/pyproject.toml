[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-lesson"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "pillow==10.4.0",
    "pdf2image==1.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]
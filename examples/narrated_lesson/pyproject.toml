[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-lesson"
version = "0.1.0"
description = "Scanned chapter → translated, narrated lesson (Bodhan Cookbook recipe)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests==2.32.3",
  "python-dotenv==1.0.1",
  "pymupdf==1.24.10",
  "Pillow==10.4.0",
  "fasttext-langdetect==1.2.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

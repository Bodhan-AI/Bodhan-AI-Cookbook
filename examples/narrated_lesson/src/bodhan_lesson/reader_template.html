<!DOCTYPE html>
<html lang="__LANG__">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>__PAGE_TITLE__</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2421;
      --muted: #5a6b64;
      --paper: #f3efe6;
      --paper-deep: #e4ddd0;
      --band: #2f5d50;
      --active: #d8e8e2;
      --active-edge: #2f5d50;
      --player: #243b36;
      --panel: rgba(255, 255, 255, 0.55);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Literata", "Noto Sans Devanagari", "Noto Sans Tamil",
        "Noto Sans Bengali", serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #fff8e8 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #dce8e3 0%, transparent 50%),
        linear-gradient(180deg, var(--paper) 0%, var(--paper-deep) 100%);
    }
    .shell {
      max-width: 42rem;
      margin: 0 auto;
      padding: 1.25rem 1.25rem 7rem;
    }
    header.brand { margin-bottom: 1rem; }
    header.brand .mark {
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--band);
      font-weight: 600;
      font-family: "Noto Sans Devanagari", system-ui, sans-serif;
    }
    header.brand h1 {
      margin: 0.35rem 0 0;
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      font-weight: 600;
      line-height: 1.25;
    }
    header.brand p {
      margin: 0.4rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .metrics {
      margin: 0 0 1.25rem;
      padding: 0.85rem 0.9rem;
      background: var(--panel);
      border: 1px solid rgba(47, 93, 80, 0.18);
      border-radius: 0.45rem;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr));
      gap: 0.65rem 0.85rem;
    }
    .metric-label {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      font-family: "Noto Sans Devanagari", system-ui, sans-serif;
    }
    .metric-value {
      display: block;
      margin-top: 0.15rem;
      font-size: 1.05rem;
      font-weight: 600;
    }
    .metrics-note {
      margin: 0.7rem 0 0;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .cue {
      padding: 0.65rem 0.85rem;
      margin: 0 0 0.35rem;
      border-radius: 0.35rem;
      border-left: 3px solid transparent;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }
    .cue h2 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.45rem 0.75rem;
    }
    .cue p {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.65;
    }
    .cer-badge {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--band);
      font-family: "Noto Sans Devanagari", system-ui, sans-serif;
    }
    .cue.active {
      background: var(--active);
      border-left-color: var(--active-edge);
      transform: translateX(2px);
    }
    .player {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 0.85rem 1.25rem calc(0.85rem + env(safe-area-inset-bottom));
      background: color-mix(in srgb, var(--player) 92%, black);
      color: #f4f7f5;
      box-shadow: 0 -8px 24px rgba(20, 30, 28, 0.18);
    }
    .player-inner {
      max-width: 42rem;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .player label {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.8;
      font-family: "Noto Sans Devanagari", system-ui, sans-serif;
    }
    audio {
      width: 100%;
      height: 2.4rem;
    }
    .empty { color: var(--muted); }
  </style>
</head>
<body>
  <div class="shell">
    <header class="brand">
      <div class="mark">Bodhan · narrated lesson</div>
      <h1>__PAGE_TITLE__</h1>
      <p>Sections light up as the narration plays. Metrics come from the run report when available.</p>
    </header>
__METRICS_HTML__
    <main id="reader">
__BODY_BLOCKS__
    </main>
  </div>
  <div class="player">
    <div class="player-inner">
      <label for="narration">Narration</label>
      <audio id="narration" controls preload="metadata" src="__AUDIO_NAME__"></audio>
    </div>
  </div>
  <script>
    const CUES = __CUES_JSON__;
    const audio = document.getElementById("narration");
    const nodes = new Map(
      [...document.querySelectorAll(".cue")].map((el) => [el.dataset.id, el])
    );
    let lastId = null;

    function activeCue(t) {
      for (const cue of CUES) {
        if (t >= cue.start && t < cue.end) return cue;
      }
      if (!CUES.length) return null;
      if (t < CUES[0].start) return CUES[0];
      return CUES[CUES.length - 1];
    }

    function sync() {
      const cue = activeCue(audio.currentTime || 0);
      const id = cue ? cue.id : null;
      if (id === lastId) return;
      if (lastId && nodes.get(lastId)) nodes.get(lastId).classList.remove("active");
      if (id && nodes.get(id)) {
        const el = nodes.get(id);
        el.classList.add("active");
        el.scrollIntoView({ behavior: "smooth", block: "center" });
      }
      lastId = id;
    }

    audio.addEventListener("timeupdate", sync);
    audio.addEventListener("seeked", sync);
    audio.addEventListener("play", sync);
  </script>
</body>
</html>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bodhan-tool-agent"
version = "0.1.0"
description = "MCP tool server and task agent for Bodhan AI's Indic models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Balavignesh A.U", email = "bala@example.com" }]

dependencies = [
    "mcp>=1.0.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pymupdf>=1.24.0",        # PDF → images
    "pillow>=10.0.0",         # Image processing
    "pydub>=0.25.1",          # Audio chunking (uses ffmpeg)
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",        # Retry with backoff
    "click>=8.0.0",           # CLI parsing
    "aiofiles>=24.0.0",       # Async file I/O
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
bodhan-agent = "bodhan_agent.__main__:main"
bodhan-mcp = "bodhan_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bodhan_mcp", "src/bodhan_agent"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests that call real APIs",
    "unit: unit tests with no API calls",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

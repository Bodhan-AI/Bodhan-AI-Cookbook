[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-task-agent"
version = "0.1.0"
description = "Bodhan MCP tool server and a task agent for Indian-language speech, translation, speech and OCR"
requires-python = ">=3.10"
dependencies = [
  "httpx==0.28.1",
  "mcp==1.30.0",
  "pillow==13.0.0",
  "pypdfium2==5.15.2",
  "python-dotenv==1.2.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bodhan_mcp = ["rules.json"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "indic-task-agent"
version = "0.1.0"
description = "An MCP server that wraps Bodhan's Indic models as tools, plus a task agent that uses them."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
# Exact versions live in requirements.txt (direct) and requirements-lock.txt (full tree).
dependencies = [
    "mcp>=2.3,<3",
    "openai>=3.51,<4",
    "httpx>=0.28,<0.29",
    "pydantic>=2.14,<3",
    "numpy>=2.0",
    "pillow>=11",
    "pypdfium2>=5.15,<6",
    "python-docx>=1.2,<2",
    "python-dotenv>=1.2,<2",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.5", "ruff>=0.17"]

[project.scripts]
bodhan-mcp = "bodhan_mcp.server:main"
bodhan-agent = "bodhan_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bodhan_mcp = ["catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

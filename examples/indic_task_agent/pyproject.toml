[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indic-task-agent"
version = "0.1.0"
description = "MCP tool server for Bodhan's Indic models, plus a task agent that uses it"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "openai==3.55.1",
    "httpx==0.28.1",
    "pydantic==2.14.4",
    "tenacity==9.2.1",
    "pillow==13.0.0",
    "pypdfium2==5.15.2",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

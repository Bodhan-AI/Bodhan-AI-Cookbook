<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FAF7F0"><meta name="description" content="Dub English videos into Indian languages and review every sentence.">
<title>Bodhan Dub Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#FAF7F0;--p:#FFFFFF;--p2:#F4EEDF;--line:#E8DEC8;--field:#857858;
 --tx:#1F1B14;--mut:#5C5346;
 --gold:#D4AF37;--honey:#E6C76B;--bronze:#8A6914;--bronze-d:#6B500F;--tint:#F7EDC9;
 --ac:#8A6914;--ok:#14663A;--warn:#7A5200;--bad:#B42318;
 --shadow:0 2px 14px rgba(138,105,20,.08);--shadow-h:0 10px 30px rgba(138,105,20,.16);--glow:0 0 0 3px rgba(212,175,55,.28);
 --r:16px;--lw:92px;
 --serif:"Playfair Display",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 "DM Sans","Plus Jakarta Sans",system-ui,"Noto Sans","Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Bengali",sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:var(--bronze);text-underline-offset:3px;cursor:pointer}
a:hover{color:var(--bronze-d)}
:focus-visible{outline:3px solid var(--bronze);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--bronze);color:#fff;padding:12px 18px;border-radius:12px;z-index:100;text-decoration:none;font-weight:600}
.skip:focus{left:16px}
h1,h2{font-family:var(--serif);font-weight:700;letter-spacing:-.01em;color:var(--tx)}
h1{font-size:clamp(34px,6vw,60px);line-height:1.08;margin:8px 0 16px}
h2{font-size:clamp(24px,3.2vw,30px);margin:0 0 6px;line-height:1.2}
h2.ct{font-family:inherit;font-size:17px;font-weight:700;letter-spacing:0;margin:0 0 12px;line-height:1.3}
h1.pt{font-size:clamp(26px,4vw,34px);margin:0 0 6px;line-height:1.15}
h3{margin:0 0 12px;font-size:17px;font-weight:700}
.gold{background:linear-gradient(transparent 62%,rgba(230,199,107,.6) 62%);padding:0 4px}
.mut{color:var(--mut)}
code{background:var(--p2);padding:1px 6px;border-radius:6px;font-size:.9em}
.sp{flex:1}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* header + navigation */
header.top{position:sticky;top:0;z-index:50;background:rgba(250,247,240,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{max-width:1240px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--tx);display:inline-flex;align-items:center;gap:10px;text-decoration:none;min-height:44px;margin-right:8px}
.brand:hover{color:var(--tx)}
.brand i{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--honey),var(--gold));box-shadow:0 0 0 3px rgba(212,175,55,.25);display:inline-block}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;color:var(--mut);text-decoration:none;font-weight:600;font-size:15px;transition:background .2s,color .2s,box-shadow .2s}
nav a:hover{background:var(--p2);color:var(--tx)}
nav a.on{background:var(--tint);color:var(--tx);box-shadow:inset 0 -3px 0 var(--gold)}
nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.qs{flex:1;min-width:240px;max-width:360px}
.pill{display:inline-flex;align-items:center;min-height:30px;border-radius:999px;background:var(--p2);padding:2px 14px;font-size:13px;font-weight:600;color:var(--mut);border:1px solid var(--line)}
.pill[data-s]{text-transform:capitalize}
.cnt{font-family:"DM Sans",system-ui,sans-serif;font-size:15px;font-weight:500}
.pill[data-s=done]{background:#DDF0E3;color:#14532D;border-color:#B7DEC2}
.pill[data-s=running],.pill[data-s=queued]{background:#FCEFC4;color:#5E4300;border-color:#E6C76B}
.pill[data-s=error],.pill[data-s=finished_with_errors]{background:#FBE0DC;color:#8E1B10;border-color:#F2B8B0}
main{max-width:1240px;margin:0 auto;padding:32px 24px 72px;outline:none}
.foot{max-width:1240px;margin:0 auto;padding:0 24px 40px;color:var(--mut);font-size:13px}

/* surfaces */
.card{background:var(--p);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s,transform .2s}
.card:hover{border-color:var(--gold);box-shadow:var(--glow),var(--shadow-h)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.grid .card:hover{transform:translateY(-2px)}
.pname{font-size:18px;margin:0 0 4px;word-break:break-word}
.hero{text-align:center;padding:48px 24px 44px;margin-bottom:24px;border:1px solid var(--line);border-radius:24px;background:radial-gradient(900px 260px at 50% -40px,#FBF1D0,transparent),#fff;box-shadow:var(--shadow)}
.hero p{max-width:600px;margin:0 auto 26px;color:var(--mut);font-size:17px}
.qa{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--p);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow);margin-bottom:14px}
.qa .search{flex:1;min-width:220px}
.status{margin:0 0 18px;font-size:14px}
.status .bad{color:var(--bad);font-weight:600}
.diag{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
.diag:empty{display:none}.diag ul{list-style:none;margin:0;padding:0}
.diag li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.diag li:last-child{border:0}
.diag .ic{flex:none;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.diag .ic.ok{background:#DDF0E3;color:#14532D}.diag .ic.no{background:#FBE0DC;color:#8E1B10}.diag .ic.wt{background:#FCEFC4;color:#5E4300}
.diag summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--bronze);font-weight:600}
.diag pre{white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--p2);padding:12px;border-radius:10px;overflow-x:auto;margin:0 0 12px}

/* controls (44px minimum targets) */
.btn{background:var(--bronze);color:#fff;border:1px solid var(--bronze);border-radius:999px;padding:0 24px;min-height:44px;font:600 15px/1 "DM Sans",system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:background .2s,box-shadow .2s,border-color .2s,transform .2s}
.btn:hover{background:var(--bronze-d);border-color:var(--bronze-d);box-shadow:var(--glow);color:#fff}
.btn:active{transform:translateY(1px)}
.btn.g{background:#fff;color:var(--tx);border-color:#cdbf9f}
.btn.g:hover{background:var(--tint);border-color:var(--gold);box-shadow:var(--glow);color:var(--tx)}
.btn.sm{padding:0 16px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button{font-family:inherit}
input[type=text],input[type=password],input[type=search],select,textarea{background:#fff;border:1px solid var(--field);border-radius:12px;padding:10px 14px;width:100%;min-height:44px;color:var(--tx);font:inherit;font-size:16px;transition:border-color .2s,box-shadow .2s}
input::placeholder,textarea::placeholder{color:#6E6350}
input:hover,select:hover,textarea:hover{border-color:var(--bronze)}
input:focus-visible,select:focus-visible,textarea:focus-visible{border-color:var(--bronze);box-shadow:var(--glow);outline:3px solid var(--bronze);outline-offset:1px}
textarea{min-height:92px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--bronze);margin:0 10px 0 0;flex:none}
label:has(>input[type=checkbox]){display:inline-flex;align-items:center;min-height:44px;cursor:pointer}
input[type=range]{width:100%;min-height:44px;accent-color:var(--bronze);padding:0;border:0;background:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;display:inline-flex;align-items:center;padding:0 18px;border:1px solid var(--field);background:#fff;color:var(--tx);border-radius:999px;cursor:pointer;font-size:15px;font-weight:500;transition:background .2s,border-color .2s,box-shadow .2s}
.chip:hover{border-color:var(--gold);box-shadow:var(--glow)}
.chip.on{background:var(--tint);border-color:var(--bronze);box-shadow:inset 0 -3px 0 var(--gold);font-weight:700}
.drop{border:2px dashed #b9a878;border-radius:var(--r);padding:40px 24px;text-align:center;background:#fff;transition:border-color .2s,background .2s}
.drop.over{border-color:var(--bronze);background:var(--tint)}
.tabs{display:flex;gap:4px;background:var(--p2);border-radius:14px;padding:4px;flex-wrap:wrap}
.tabs button{min-height:44px;padding:0 18px;border:0;background:transparent;border-radius:10px;color:var(--mut);font-size:15px;font-weight:600;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.tabs button:hover{color:var(--tx);background:rgba(255,255,255,.75)}
.tabs button.on{background:#fff;color:var(--tx);box-shadow:0 1px 6px rgba(138,105,20,.18),inset 0 -3px 0 var(--gold)}
.backlink{display:inline-flex;align-items:center;min-height:44px;color:var(--mut);text-decoration:none;font-weight:600}
.backlink:hover{color:var(--tx)}

/* tables + badges */
table{width:100%;border-collapse:collapse}
.tw{overflow-x:auto}
.tw>table{min-width:560px}
td,th{padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{color:var(--mut);font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.sent tr:hover td{background:#FDFBF4}
.b{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;margin:0 4px 4px 0;background:#F1EBDC;color:#3D372C}
.b.ok{background:#DDF0E3;color:#14532D}.b.warn{background:#FCEFC4;color:#5E4300}.b.bad{background:#FBE0DC;color:#8E1B10}
.tr{font-size:17px;line-height:1.55}.en{color:var(--mut);font-size:13px}
.edit{background:var(--p2);border:1px solid var(--line);border-radius:14px;padding:18px;margin:4px 0 10px}
.edit label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 6px}
.edit fieldset.own{margin:18px 0 0;border:1px dashed #cdbf9f;border-radius:14px;padding:14px 16px;background:#fff}.edit fieldset.own legend{font-weight:700;padding:0 8px}
.read{font-size:18px;line-height:1.6;background:var(--p2);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.osrow{display:grid;grid-template-columns:110px 1fr 1.2fr 110px;gap:14px;padding:12px 0;border-top:1px solid var(--line);align-items:start}.osrow textarea{min-height:64px}@media(max-width:820px){.osrow{grid-template-columns:1fr}}
.edit label:has(>input[type=checkbox]){display:inline-flex;margin:0}
.steps div{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.steps .p{color:var(--mut)}
.steps .bar{height:6px;background:var(--line);border-radius:3px;margin:6px 0;flex:1;overflow:hidden}
.steps .bar i{display:block;height:6px;background:linear-gradient(90deg,var(--honey),var(--gold));border-radius:3px;transition:width .4s}
.lane{position:relative;height:36px;background:#F1EBDC;border-radius:8px;margin:8px 0 8px var(--lw)}
.lane .lab{position:absolute;left:calc(-1 * var(--lw));top:7px;width:calc(var(--lw) - 8px);color:var(--mut);font-size:12px;font-weight:600}
.lane i{position:absolute;top:3px;bottom:3px;border-radius:6px;background:var(--gold);color:var(--tx);overflow:hidden;white-space:nowrap;font-size:11px;font-style:normal;padding:5px 6px;cursor:pointer;transition:filter .2s}
.lane i:hover{filter:brightness(1.06);box-shadow:0 0 0 2px var(--bronze)}
.lane i.o{background:#E4DAC2}.lane i.w{background:#F3D58A}.lane i.f{background:#F4B8B0}
.lane i.s{background:repeating-linear-gradient(45deg,#EDE6D3,#EDE6D3 4px,#E3DAC2 4px,#E3DAC2 8px);color:#5C5346}
.ph{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--bronze);border-radius:2px;z-index:3;pointer-events:none}
.warn-box,.err-box{border-radius:12px;padding:12px 16px;margin-bottom:14px;border-left:4px solid}
.warn-box{background:#FFF4D6;color:#5E4300;border-color:var(--gold)}
.err-box{background:#FDECEA;color:#8E1B10;border-color:var(--bad)}
video{width:100%;max-height:440px;background:#1F1B14;border-radius:12px}
.cap{min-height:30px;text-align:center;margin-top:10px;font-size:18px;font-weight:500}
.foot a{color:var(--bronze)}
.foot .pill{display:flex;width:fit-content;margin:0 0 10px}

@media(max-width:760px){
 :root{--lw:0px}
 header.top{position:static;backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
 .hbar{padding:8px 16px}.qs{order:5;max-width:none;flex-basis:100%}
 nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(250,247,240,.98);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(138,105,20,.10)}
 nav a{flex-direction:column;justify-content:center;gap:2px;min-height:54px;padding:4px 2px;border-radius:12px;font-size:11.5px;line-height:1.15;text-align:center}
 nav a svg{width:22px;height:22px}
 nav a.on{background:var(--tint);box-shadow:inset 0 3px 0 var(--gold)}
 main{padding:20px 16px 110px}.card{padding:18px}.hero{padding:32px 16px}.foot{padding-bottom:96px}
 .sent>tbody>tr:first-child{display:none}
 .sent,.sent>tbody,.sent>tbody>tr,.sent>tbody>tr>td{display:block;width:auto!important}
 .sent>tbody>tr{border-bottom:1px solid var(--line);padding:10px 0}.sent>tbody>tr>td{border:0;padding:4px 0;text-align:left!important}
 .sent>tbody>tr[hidden]{display:none}
 .lane{margin-top:28px}.lane .lab{top:-22px;left:0;width:auto}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* gate */
body.locked header.top,body.locked main,body.locked footer.foot{filter:blur(10px);user-select:none;pointer-events:none}
#gate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px;background:rgba(250,247,240,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow:auto}
.gcard{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 60px rgba(60,45,10,.18);width:100%;max-width:440px;padding:28px}
.srv{display:flex;gap:12px;align-items:center;font-weight:600;min-height:28px}
.dot{width:12px;height:12px;border-radius:50%;background:#cdbf9f;flex:none}
.dot.ok{background:#2E7D4F}.dot.bad{background:#B3261E}.dot.wait{background:var(--gold);animation:pls 1.2s ease-in-out infinite}
@keyframes pls{50%{opacity:.35}}
</style></head><body>
<a class="skip" href="#app">Skip to main content</a>
<header class="top"><div class="hbar">
 <a class="brand" href="#" aria-label="Bodhan Dub Studio home"><i aria-hidden="true"></i>Dub Studio</a>
 <nav aria-label="Main">
  <a data-r="" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Projects</span></a>

 </nav>
 <span class="sp"></span>
 <div class="qs"><label class="sr" for="jump">Jump to a project or tool</label><input id="jump" type="search" list="jumplist" placeholder="Jump to…" autocomplete="off"><datalist id="jumplist"></datalist></div>
</div></header>
<main id="app" tabindex="-1"></main>
<footer class="foot"><span class="pill">AI-dubbed output · Bodhan models only</span>Output is AI-generated speech from a fixed voice library. It does not clone or imitate the original speaker.</footer>
<script>
let _cfg={};try{const x=new XMLHttpRequest();x.open('GET','config.json',false);x.send();if(x.status==200)_cfg=JSON.parse(x.responseText)}catch{}   // Vercel: {"api":"https://your-backend"}; served by the backend itself: {"api":""}
const BASE=String(_cfg.api||'').replace(/\/$/,'')
let _mem=''
try{localStorage.removeItem('dub_token')}catch{}
const tok=()=>{try{return sessionStorage.getItem('dub_token')||_mem}catch{return _mem}}
const setTok=t=>{_mem=t||'';try{if(t)sessionStorage.setItem('dub_token',t);else sessionStorage.removeItem('dub_token')}catch{}}
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)]
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
// ---------------- gate: server check, then access token. Everything behind it stays blurred and inert.
let UNLOCK=null
const PREVIEW=`<section class="hero" aria-hidden="true"><div style="font-family:var(--serif);font-size:clamp(34px,6vw,60px);line-height:1.08;margin:8px 0 16px">Every voice.<br><span class="gold">Every Indian language.</span></div><p>Upload an English video, pick the languages, and review every dubbed sentence.</p></section><div class="card" style="height:130px" aria-hidden="true"></div><div class="card" style="height:130px;margin-top:16px" aria-hidden="true"></div>`
function setLocked(on){
  document.body.classList.toggle('locked',on)
  $$('header.top,main,footer.foot').forEach(e=>{if(on){e.setAttribute('inert','');e.setAttribute('aria-hidden','true')}else{e.removeAttribute('inert');e.removeAttribute('aria-hidden')}})
}
async function ping(ms=8000){
  try{const ac=new AbortController(),to=setTimeout(()=>ac.abort(),ms);const r=await fetch(BASE+'/api/health',{cache:'no-store',signal:ac.signal});clearTimeout(to)
    if(!r.ok)return{ok:false,msg:'HTTP '+r.status};return{ok:true,...(await r.json())}}catch{return{ok:false,msg:'no answer'}}
}
function unlock(msg){
  if(UNLOCK)return UNLOCK
  UNLOCK=new Promise(resolve=>{
    if(!CFG)$('#app').innerHTML=PREVIEW
    setLocked(true)
    const g=document.createElement('div');g.id='gate';g.setAttribute('role','dialog');g.setAttribute('aria-modal','true');g.setAttribute('aria-labelledby','gt')
    g.innerHTML=`<div class="gcard">
      <div class="brand" style="margin:0 0 6px"><i aria-hidden="true"></i>Dub Studio</div>
      <h1 id="gt" class="pt">Sign in</h1>
      <p class="mut" style="margin:0 0 18px">Start the server, then enter the access token to continue.</p>
      <div class="srv"><span id="gdot" class="dot wait" aria-hidden="true"></span><span id="gs" role="status" aria-live="polite">Checking the server…</span></div>
      <p class="row" style="margin:12px 0 18px"><button type="button" class="btn sm" id="gstart" hidden>Start server</button></p>
      <div id="gerr" class="err-box" role="alert" hidden></div>
      <form id="gform" autocomplete="off">
        <label for="gtok" style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Access token</label>
        <input id="gtok" type="password" autocomplete="off" spellcheck="false" placeholder="DUB_ACCESS_TOKEN" style="margin-bottom:14px;font-family:ui-monospace,monospace" disabled>
        <button class="btn" id="ggo" type="submit" disabled style="width:100%">Unlock</button>
      </form>
      <p class="mut" style="margin:14px 0 0;font-size:12px">Backend: <code>${esc(BASE||'(not set)')}</code> · the token is kept only for this browser tab.</p>
    </div>`
    document.body.appendChild(g)
    const dot=$('#gdot',g),st=$('#gs',g),btn=$('#gstart',g),err=$('#gerr',g),inp=$('#gtok',g),go=$('#ggo',g)
    const setSrv=(k,t)=>{dot.className='dot '+k;st.textContent=t}
    const showErr=m=>{err.hidden=!m;err.textContent=m||''}
    const finish=cfg=>{CFG=cfg;g.remove();setLocked(false);UNLOCK=null;resolve(cfg)}
    let up=false,busy=false
    const tryTok=async(t,quiet)=>{
      if(busy)return;busy=true;go.disabled=true;showErr('')

        if(r.status===401){setTok('');if(!quiet)showErr('That token was not accepted. Copy DUB_ACCESS_TOKEN from Render → your service → Environment.');inp.value='';inp.focus();return}

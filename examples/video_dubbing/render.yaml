services:
  - type: web
    name: bodhan-dub-api
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    plan: starter            # free (512 MB) can run out of memory on long videos; starter + disk is safer
    healthCheckPath: /api/health
    disk: { name: dub-data, mountPath: /data, sizeGB: 5 }   # remove this block on the free plan (data is then ephemeral)
    envVars:
      - { key: DUB_ACCESS_TOKEN, generateValue: true }       # copy it from the Render dashboard; the UI asks for it once
      - { key: DUB_CORS_ORIGINS, sync: false }               # e.g. https://your-app.vercel.app
      - { key: BODHAN_TRANSCRIBE_KEY, sync: false }
      - { key: BODHAN_TRANSLATE_KEY, sync: false }
      - { key: BODHAN_SPEAK_KEY, sync: false }
      - { key: BODHAN_OCR_KEY, sync: false }      # optional: on-screen text (Indic-OCR)
      - { key: LLM_BASE_URL, sync: false }
      - { key: LLM_MODEL, sync: false }
      - { key: LLM_API_KEY, sync: false }

# Indic script guard: Unicode ranges for LLM output validation
# Any LLM response containing characters in these ranges is structurally rejected
indic_script_ranges:
  - [0x0600, 0x06FF]   # Arabic (Urdu, Sindhi, Kashmiri)
  - [0x08A0, 0x08FF]   # Arabic Extended-A
  - [0x0900, 0x097F]   # Devanagari (Hindi, Marathi, Sanskrit, Konkani, Bodo, Dogri, Maithili, Nepali)
  - [0x0980, 0x09FF]   # Bengali & Assamese
  - [0x0A00, 0x0A7F]   # Gurmukhi (Punjabi)
  - [0x0A80, 0x0AFF]   # Gujarati
  - [0x0B00, 0x0B7F]   # Odia
  - [0x0B80, 0x0BFF]   # Tamil
  - [0x0C00, 0x0C7F]   # Telugu
  - [0x0C80, 0x0CFF]   # Kannada
  - [0x0D00, 0x0D7F]   # Malayalam
  - [0x1C50, 0x1C7F]   # Ol Chiki (Santali)
  - [0xABC0, 0xABFF]   # Meetei Mayek (Manipuri)

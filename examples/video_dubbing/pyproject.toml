[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-dubbing-recipe"
version = "0.1.0"
description = "Agentic English to Indian-language video dubbing using only Bodhan models"
requires-python = ">=3.10"
dependencies = [
  "httpx==0.28.1",
  "openai==3.51.0",
  "numpy==2.5.3",
  "soundfile==0.14.0",
  "PyYAML==6.0.3",
  "fastapi==0.163.1",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "pillow==12.3.0",
  "uharfbuzz==0.57.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bodhan_dub = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B905", "B008"]

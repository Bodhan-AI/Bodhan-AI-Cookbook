[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan_dub"
version = "0.1.0"
description = "Agentic English video dubbing into Indian languages using Bodhan models"
requires-python = ">=3.10"
dependencies = [   # exact tested pins are in requirements.txt
    "numpy",
    "soundfile",
    "requests",
    "PyYAML",
    "torch",
    "torchaudio",
    "silero-vad",
    "demucs",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-video-dubbing"
version = "0.0.1"
description = "Bodhan video dubbing with bounded duration recovery, subtitles and quality reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["silero-vad==6.2.3", "torch==2.8.0", "numpy==2.2.6", "networkx==3.4.2", "filelock==4.2.12", "openai==2.8.1", "PyYAML==6.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
bodhan_dub = ["templates/*.html"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-task-agent"
version = "1.0.0"
description = "An MCP server exposing Bodhan's Indic speech, translation, TTS and OCR models as tools, plus an unattended task agent that plans, acts, verifies and reports."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
# Runtime pins live in requirements.txt (the Cookbook convention); these are the compatible ranges.
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "openai>=1.60",
  "numpy>=1.26",
  "pypdfium2>=4.30",
  "pillow>=10.4",
  "python-dotenv>=1.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
bodhan-mcp = "bodhan_mcp.__main__:main"
bodhan-agent = "bodhan_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bodhan_mcp = ["data/*.json"]

[tool.ruff]
line-length = 160
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "ASYNC240", "ASYNC109"]  # Indic scripts are intentional; small local file ops in async code are fine

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=70,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-task-agent"
version = "0.1.0"
description = "MCP tool server and budgeted, verifiable task agent for Bodhan Indic APIs"
requires-python = ">=3.10"
dependencies = ["requests==2.32.5", "PyMuPDF==1.26.7", "Pillow==12.3.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.13.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
exclude = ["outputs", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

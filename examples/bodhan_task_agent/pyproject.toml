[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "bodhan-task-agent"
version = "0.1.0"
description = "MCP tool server for Bodhan's Indic models, plus a task agent that uses it."
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "httpx==0.28.1",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
    "openai==3.57.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "respx==0.23.1",
    "ruff==0.17.5",
]

[project.scripts]
bodhan-mcp = "bodhan_mcp.__main__:main"
bodhan-agent = "bodhan_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bodhan_mcp", "src/bodhan_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

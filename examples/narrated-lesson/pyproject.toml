[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-lesson"
version = "0.1.0"
description = "Scanned chapter to translated, narrated lesson (Bodhan OCR, Translate, Speak, Transcribe)"
requires-python = ">=3.10"
dependencies = [
    "httpx==0.28.1",
    "pymupdf==1.28.2",
    "pillow==12.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project]
name = "bodhan-tool-server-agent"
version = "0.1.0"
description = "MCP server for Bodhan Indic models plus a task agent"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "mcp==1.30.0",
    "openai==3.55.1",
    "pillow==13.0.0",
    "pillow-heif==1.8.1",
    "pydantic==2.14.3",
    "pymupdf==2.1",
    "python-dotenv==1.2.4",
]

[project.scripts]
bodhan-agent = "bodhan_agent.cli:main"
bodhan-mcp = "bodhan_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bodhan_mcp", "src/bodhan_agent"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "respx==0.23.1",
    "ruff==0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]  # SWIG types inside a PDF/image dependency
testpaths = ["tests"]
markers = ["live: real API calls, opt-in"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = ["BLE001", "C405", "PLW1510", "RUF046"]
per-file-ignores = { "tests/*" = ["ASYNC230", "SIM115", "I001"], "scripts/*" = ["SIM117", "FURB192", "C408", "RUF100", "I001", "F401", "E402"] }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-tool-agent"
version = "0.1.0"
description = "MCP tool server and task agent for Bodhan Indic AI models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests==2.32.3",
    "python-dotenv==1.2.4",
    "mcp==1.3.0",
    "pydantic==2.10.6",
    "openai==1.63.0",
    "pypdf==7.0.0",
    "pillow==13.0.0",
    "pypdfium2==5.15.2",
    "pytest==9.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

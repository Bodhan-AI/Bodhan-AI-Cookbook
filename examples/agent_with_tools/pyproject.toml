[project]
name = "bodhan-agent-with-tools"
version = "0.1.0"
description = "Bodhan MCP tool server and a LangGraph task agent (first iteration: translate only)"
requires-python = ">=3.10"
dependencies = [
  "langgraph==1.2.24",
  "langchain-core==1.8.4",
  "langchain-openai==1.8.5",
  "langchain-mcp-adapters==0.3.2",
  "mcp==1.30.0",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
  "langfuse==5.2.0",
  "pyyaml==6.0.4",
  "pypdfium2==5.15.2",
  "pillow==13.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0"]
eval = ["deepeval==4.3.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "stub: eval with stubbed Bodhan tools (Rs 0, needs the LLM key)",
  "live: eval that spends Bodhan credit (needs EVAL_LIVE=1)",
]

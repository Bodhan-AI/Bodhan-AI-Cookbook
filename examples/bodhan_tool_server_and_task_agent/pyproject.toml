[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bodhan-tool-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12,<2",
  "openai>=1.70,<2",
  "httpx>=0.27,<1",
  "Pillow>=12,<13",
  "pypdfium2>=4.30,<5",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/bodhan_mcp", "src/bodhan_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

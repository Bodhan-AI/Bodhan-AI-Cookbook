[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-tool-agent"
version = "0.1.0"
description = "MCP tool server and task agent for Bodhan Indic models (OCR, translation, speech, transcription)"
requires-python = ">=3.10"
dependencies = [
    "mcp==1.30.0",
    "openai==3.55.1",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "pydantic==2.14.3",
    "pypdfium2==5.15.2",
    "pillow==13.0.0",
    "imageio-ffmpeg==0.8.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]
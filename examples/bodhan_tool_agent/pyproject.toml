[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bodhan-tool-agent"
version = "0.1.0"
description = "Standalone Model Context Protocol (MCP) server for Bodhan Indic models and autonomous CLI Task Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Thomas Antony" }
]
dependencies = [
    # Keep these pins in lock-step with requirements.txt: mcp 2.x renamed
    # FastMCP to MCPServer and breaks this v1-based server.
    "mcp==1.3.0",
    "pydantic==2.10.6",
    "openai==1.65.1",
    "pymupdf==1.25.3",
    "numpy==2.2.3",
    "python-dotenv==1.0.1",
    "httpx==0.28.1",
    "pillow==12.2.0",
    "soundfile==0.14.0",
    "imageio-ffmpeg==0.8.1",
]

[project.optional-dependencies]
av = [
    "av>=14.0.0",
]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
    "jupyter>=1.1.0",
    "ipykernel==6.29.5",
]

[project.scripts]
bodhan-agent = "bodhan_agent.__main__:run"
bodhan-mcp = "bodhan_mcp.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["bodhan_mcp", "bodhan_agent"]

# Ship the implementation package as-is so the shims' `from src...` imports
# keep working after a normal (non-editable) install.
[tool.hatch.build.targets.wheel.force-include]
"src" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

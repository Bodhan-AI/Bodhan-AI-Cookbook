[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-tool-agent"
version = "0.1.0"
description = "MCP server for Bodhan Indic models and task agent"
requires-python = ">=3.10"
dependencies = [
  "mcp==1.6.0",
  "openai==1.68.2",
  "httpx==0.28.1",
  "pydantic>=2.12.5",
  "pypdf==5.3.0",
  "pypdfium2==4.30.1",
  "Pillow>=11.1.0",
  "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.9.9",
]

[tool.setuptools.packages.find]
where = ["src"]
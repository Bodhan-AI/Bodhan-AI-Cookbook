[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bodhan-tool-agent"
version = "0.1.0"
description = "Standalone Model Context Protocol (MCP) server for Bodhan Indic models and autonomous CLI Task Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Thomas Antony" }
]
dependencies = [
    "mcp>=1.3.0",
    "pydantic>=2.10.0",
    "openai>=1.65.0",
    "pymupdf>=1.25.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    "pillow>=12.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
]

[project.scripts]
bodhan-agent = "src.bodhan_agent.__main__:main"
bodhan-mcp = "src.bodhan_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bodhan_mcp", "src/bodhan_agent", "src/common"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

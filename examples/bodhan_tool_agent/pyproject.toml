[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-tool-agent"
version = "0.1.0"
description = "MCP server for Bodhan's Indic models, plus a task agent that uses it"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "openai==3.51.0",
    "pydantic==2.14.3",
    "numpy==2.2.6",
    "requests==2.34.2",
    "pypdfium2==5.15.2",
    "pillow==13.0.0",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 180
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # prompts and tool descriptions are long single lines on purpose

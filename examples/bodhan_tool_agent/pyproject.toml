[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-recipe"
version = "0.1.0"
description = "Bodhan MCP tool server and task agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2,<2",
  "openai>=1.40,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pymupdf>=1.24,<2",
  "soundfile>=0.12,<1",
  "python-dotenv>=1.0,<2",
  "tenacity>=8.3,<9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.scripts]
bodhan-mcp = "bodhan_mcp.__main__:main"
bodhan-agent = "bodhan_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bodhan_mcp*", "bodhan_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

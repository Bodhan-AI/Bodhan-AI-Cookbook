[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-tool-agent"
version = "0.1.0"
description = "MCP tool server over Bodhan's Indic models, plus a budget-aware task agent."
requires-python = ">=3.10"
dependencies = [
  "mcp==1.30.0",
  "openai==3.57.0",
  "httpx==0.28.1",
  "pydantic==2.14.4",
  "pypdfium2==5.15.2",
  "pillow==13.0.0",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
bodhan-mcp = "bodhan_mcp.__main__:main"
bodhan-agent = "bodhan_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bodhan_core = ["library.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-tool-agent"
version = "0.1.0"
description = "MCP server exposing Bodhan's Indic speech, translation, TTS and OCR models as tools, plus a task agent that plans, calls them and verifies its outputs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp==2.3.0",
    "openai==3.51.0",
    "httpx==0.28.1",
    "pydantic==2.14.3",
    "pypdfium2==5.15.2",
    "pillow==13.0.0",
    "numpy==2.5.5",
    "imageio-ffmpeg==0.8.1",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
]

[project.scripts]
bodhan-agent = "bodhan_agent.__main__:main"
bodhan-mcp = "bodhan_mcp.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["bodhan_mcp*", "bodhan_agent*"]

[tool.setuptools.package-data]
bodhan_agent = ["web_page.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "outputs", "sample_data", "bodhan_mcp_out", ".bodhan_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["bodhan_mcp", "bodhan_agent"]

[tool.ruff.lint.per-file-ignores]
# long natural-language test fixtures
"scripts/make_sample_data.py" = ["E501"]

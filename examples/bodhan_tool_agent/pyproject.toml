[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bodhan-tool-agent"
version = "0.1.0"
description = "Bodhan MCP Tool Server and Task Agent for Indic language processing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # MCP framework
    "mcp>=1.0.0",

    # OpenAI-compatible client (for Bodhan API and LLM)
    "openai>=1.54.0",

    # HTTP client
    "httpx>=0.27.0",

    # Audio processing
    "pydub>=0.25.1",
    "soundfile>=0.12.1",

    # PDF and image handling
    "pdf2image>=1.17.0",
    "Pillow>=10.4.0",

    # CLI
    "click>=8.1.7",

    # Async utilities
    "anyio>=4.6.0",
    "tenacity>=9.0.0",          # retry with backoff

    # Data validation
    "pydantic>=2.9.0",

    # Sentence tokenization (for TTS chunking)
    "nltk>=3.9.0",

    # Indic script utilities
    "indic-nlp-library>=0.92",

    # String metrics (for verification)
    "rapidfuzz>=3.10.0",

    # Env loading
    "python-dotenv>=1.0.1",

    # Logging
    "structlog>=24.4.0",

    # Progress bars
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-Pillow",
]

[project.scripts]
bodhan-agent = "bodhan_agent.__main__:main"
bodhan-mcp = "bodhan_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bodhan_mcp", "src/bodhan_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

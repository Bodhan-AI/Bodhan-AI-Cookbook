[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-tool-agent"
version = "1.0.0"
description = "Bodhan MCP Tool Server and Task Agent for Indic language processing"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "pydantic>=2.7.0",
    "pypdfium2>=4.30.0",
    "soundfile>=0.12.1",
    "pillow>=13.0.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=24.1.0",
]

[project.scripts]
bodhan-agent = "bodhan_agent.__main__:main"
bodhan-mcp = "bodhan_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-eval"
version = "0.1.0"
description = "Agentic evaluation harness for Bodhan Indic-Translate and Indic-Speak outputs"
requires-python = ">=3.10"
dependencies = [
  "openai==1.54.4",
  "httpx==0.27.2",
  "sacrebleu==2.4.3",
  "numpy==1.26.4",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E701", "E702", "E731", "E741", "B008", "B905"]

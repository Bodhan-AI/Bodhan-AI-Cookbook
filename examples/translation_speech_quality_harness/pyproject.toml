[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-eval"
version = "0.1.0"
description = "Agentic evaluation harness for Bodhan Indic-Translate and Indic-Speak outputs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx==0.28.1",
  "openai==3.55.1",
  "pydantic==2.14.4",
  "numpy==2.4.6",
  "sacrebleu==2.6.0",
  "rapidfuzz==3.14.6",
  "regex==2026.11.19",
  "indic-transliteration==2.3.82",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
bodhan-eval = "bodhan_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bodhan_eval = ["thresholds.json", "judge/rubric.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

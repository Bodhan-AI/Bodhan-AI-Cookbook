[project]
name = "bodhan-eval"
version = "0.1.0"
description = "Translation and speech quality harness for Bodhan Indic-Translate and Indic-Speak"
requires-python = ">=3.10"
dependencies = [
    "httpx==0.28.1",
    "openai==2.38.0",
    "python-dotenv==1.2.2",
    "regex==2026.5.9",
    "numpy==1.26.4",
    "soundfile==0.14.0",
    "sacrebleu==2.4.3",
    "jiwer==4.0.0",
    "rapidfuzz==3.14.5",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bodhan_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The judge prompt text is part of every judge cache key; re-wrapping it would invalidate the cache.
"src/bodhan_eval/judge.py" = ["E501"]

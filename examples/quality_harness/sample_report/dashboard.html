<!DOCTYPE html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quality Harness — Proof Sheet</title>
<style>:root{
  --paper:#f7f3ea; --ink:#23201b; --ink-soft:#5b5347; --rule:#ddd3c0; --card:#fffdf7;
  --accent:#7a1f1f; --accent-soft:#9c6b2e;
  --minor:#5b6b7a; --major:#b8860b; --critical:#a01c1c;
  --minor-bg:#e7ecf1; --major-bg:#f6e8c6; --critical-bg:#f3d9d4;
  --good:#2f6b43; --bad:#a01c1c; --chip:#efe8d6;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"SF Mono",ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;
  --indic:"Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Bengali","Nirmala UI","Mangal","Latha","Vrinda",system-ui;
  --shadow:0 2px 8px rgba(40,30,15,.08),0 12px 40px rgba(40,30,15,.06);
}
html[data-theme="midnight"]{
  --paper:#15181f; --ink:#ece3cf; --ink-soft:#a99f8c; --rule:#2c313c; --card:#1b1f28;
  --accent:#e0836a; --accent-soft:#d8b06a;
  --minor:#8fa6bd; --major:#e0b84a; --critical:#ef6a5a;
  --minor-bg:#232a35; --major-bg:#332d1c; --critical-bg:#3a2320;
  --good:#6fcf97; --bad:#ef6a5a; --chip:#262b35;
  --shadow:0 2px 10px rgba(0,0,0,.4),0 18px 50px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.2px}
a{color:var(--accent)}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--card);padding:6px;z-index:50}
:lang(hi),:lang(ta),:lang(bn),.indic{font-family:var(--indic);line-height:1.8}

.strip{display:flex;align-items:center;gap:20px;padding:18px 26px;border-bottom:2px solid var(--rule);
  position:sticky;top:0;background:var(--paper);z-index:20}
.strip-title{display:flex;align-items:center;gap:14px}
.monogram{font-family:var(--serif);font-size:34px;color:var(--accent);line-height:1}
.strip h1{margin:0;font-size:21px}
.sub{margin:0;color:var(--ink-soft);font-size:12.5px;font-style:italic}
.strip-meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-left:auto;font-size:12.5px;color:var(--ink-soft)}
.strip-meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.strip-actions{display:flex;gap:8px}
.btn{font-family:var(--sans);background:var(--card);color:var(--ink);border:1px solid var(--rule);
  border-radius:8px;padding:7px 11px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.ghost{background:transparent}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;padding:22px 26px}
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi .label{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.6px}
.kpi .value{font-family:var(--serif);font-size:38px;line-height:1.05;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .target{font-size:12px;color:var(--ink-soft)}
.gauge{height:6px;border-radius:4px;background:var(--rule);margin-top:10px;position:relative;overflow:visible}
.gauge > i{position:absolute;left:0;top:0;height:100%;border-radius:4px;background:var(--good)}
.gauge.miss > i{background:var(--bad)}
.gauge .tick{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink)}

.tabs{display:flex;gap:4px;padding:0 26px;border-bottom:1px solid var(--rule)}
.tab{background:transparent;border:0;border-bottom:3px solid transparent;color:var(--ink-soft);
  padding:12px 14px;cursor:pointer;font-size:14px;font-weight:600}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{padding:22px 26px;max-width:1200px}

.heatmap-wrap h2{margin:.2em 0 .5em;font-size:16px}
.heatmap{display:grid;gap:3px;overflow:auto}
.hm-cell{min-width:46px;height:40px;border-radius:5px;display:flex;align-items:flex-end;justify-content:flex-end;
  padding:3px 5px;font-size:10px;color:#fff;cursor:pointer;position:relative;font-variant-numeric:tabular-nums}
.hm-head{background:transparent;color:var(--ink-soft);font-size:11px;align-items:center;justify-content:center;cursor:default}
.hm-cell.low-support{outline:2px dashed var(--rule);outline-offset:-2px}
.hint{color:var(--ink-soft);font-size:12px;font-style:italic}

.filterbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 10px;
  padding:12px;background:var(--card);border:1px solid var(--rule);border-radius:12px;position:sticky;top:76px;z-index:10}
.filterbar input[type=search],.filterbar select{font-family:var(--sans);background:var(--paper);color:var(--ink);
  border:1px solid var(--rule);border-radius:8px;padding:7px 9px;font-size:13.5px}
.filterbar input[type=search]{min-width:200px;flex:1}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft)}
.count{margin-left:auto;font-size:12.5px;color:var(--ink-soft)}

.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:120px 54px 90px 1fr auto;gap:12px;align-items:center;
  background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:11px 14px;cursor:pointer}
.row:hover{border-color:var(--accent)}
.row .rid{font-family:var(--mono);font-size:13px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:11.5px;color:var(--ink-soft)}
.status{font-size:12px;font-weight:600}
.status.flagged{color:var(--critical)}.status.uncertain{color:var(--major)}
.status.clean{color:var(--good)}.status.skipped{color:var(--ink-soft)}
.flagchips{display:flex;flex-wrap:wrap;gap:5px}
.fchip{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 8px;font-size:11.5px;border:1px solid}
.fchip.minor{color:var(--minor);border-color:var(--minor);background:var(--minor-bg)}
.fchip.major{color:var(--major);border-color:var(--major);background:var(--major-bg)}
.fchip.critical{color:var(--critical);border-color:var(--critical);background:var(--critical-bg)}
.fchip .dot{width:7px;height:7px;border-radius:50%}
.fchip.minor .dot{background:var(--minor)}.fchip.major .dot{background:var(--major)}.fchip.critical .dot{background:var(--critical)}
.cost{font-family:var(--mono);font-size:12px;color:var(--ink-soft)}

.drawer{position:fixed;top:0;right:0;width:min(640px,96vw);height:100%;background:var(--paper);
  border-left:2px solid var(--rule);box-shadow:var(--shadow);z-index:40;overflow:auto;transform:translateX(0)}
.drawer[hidden]{display:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;
  border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper)}
.proof-id{font-family:var(--mono);font-weight:700}
.drawer-nav{display:flex;gap:6px}
.drawer-body{padding:18px 20px}
.scrim{position:fixed;inset:0;background:rgba(20,15,5,.35);z-index:30}
.scrim[hidden]{display:none}

.textcard{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px;margin:0 0 14px}
.textcard h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft)}
.texthost{white-space:pre-wrap;word-break:break-word}
mark{border-radius:3px;padding:0 1px;color:inherit}
mark.minor{background:var(--minor-bg);box-shadow:inset 0 -2px var(--minor)}
mark.major{background:var(--major-bg);box-shadow:inset 0 -2px var(--major)}
mark.critical{background:var(--critical-bg);text-decoration:underline wavy var(--critical)}
mark .marker{font-family:var(--mono);font-size:9px;vertical-align:super;color:var(--accent);font-weight:700}

.evcard{border:1px solid var(--rule);border-left:4px solid var(--accent-soft);border-radius:8px;
  padding:11px 13px;margin:0 0 10px;background:var(--card)}
.evcard .evhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-soft)}
.evcard .evhead .cat{font-weight:700;color:var(--ink)}
.evcard .noisy{font-size:10.5px;border:1px solid var(--rule);border-radius:4px;padding:0 5px}
.evcard details{margin-top:8px}
.evcard pre{white-space:pre-wrap;word-break:break-word;background:var(--paper);border-radius:6px;padding:8px;
  font-family:var(--mono);font-size:11.5px;margin:6px 0 0}
.why{font-style:italic;color:var(--ink-soft);margin:6px 0 14px}

.wave{display:flex;align-items:flex-end;gap:1px;height:46px;background:var(--card);border:1px solid var(--rule);
  border-radius:8px;padding:5px;margin:4px 0 12px}
.wave i{flex:1;background:var(--accent-soft);min-height:1px;border-radius:1px}

table.grid{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0 18px}
table.grid th,table.grid td{border:1px solid var(--rule);padding:7px 9px;text-align:left;font-variant-numeric:tabular-nums}
table.grid th{background:var(--card);font-family:var(--sans)}
.pill{font-size:11px;border-radius:999px;padding:1px 8px}
.pill.good{background:var(--minor-bg);color:var(--good)}.pill.bad{background:var(--critical-bg);color:var(--bad)}

.help{position:fixed;inset:auto 20px 20px auto;background:var(--card);border:1px solid var(--rule);
  border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);z-index:60;max-width:300px}
.help[hidden]{display:none}.help kbd{font-family:var(--mono);background:var(--paper);border:1px solid var(--rule);
  border-radius:4px;padding:0 5px}
.help ul{margin:8px 0;padding-left:18px}.help li{margin:4px 0}

.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 26px;margin-top:20px;
  border-top:1px solid var(--rule);color:var(--ink-soft);font-size:12px}
.empty{color:var(--ink-soft);font-style:italic;padding:30px;text-align:center}

@media (max-width:640px){
  .row{grid-template-columns:1fr auto;grid-auto-rows:min-content}
  .row .rcat{grid-column:1/-1}
  .strip{flex-wrap:wrap}
}
@media (prefers-reduced-motion:no-preference){
  .row,.kpi,.evcard{transition:border-color .15s ease, transform .15s ease}
  .drawer{transition:transform .2s ease}
}
@media print{
  .tabs,.filterbar,.strip-actions,.heatmap-wrap,#scrim,.help{display:none!important}
  .drawer{position:static;width:100%;border:0;box-shadow:none}
  body{background:#fff;color:#000}
}
</style>
</head>

<a class="skip" href="#main">Skip to content</a>

<header class="strip" role="banner">
  <div class="strip-title">
    <span class="monogram" aria-hidden="true">¶</span>
    <div>
      <h1>Translation &amp; Speech Quality</h1>
      <p class="sub" id="run-sub">The proofreader's desk</p>
    </div>
  </div>
  <div class="strip-meta" id="strip-meta"></div>
  <div class="strip-actions">
    <button id="theme-toggle" class="btn" aria-label="Toggle colour theme" title="Toggle theme (paper / midnight)">◐</button>
    <button id="help-toggle" class="btn" aria-label="Keyboard shortcuts" title="Shortcuts (?)">?</button>
  </div>
</header>

<section class="kpis" id="kpis" aria-label="Headline metrics"></section>

<nav class="tabs" role="tablist" aria-label="Views">
  <button class="tab" role="tab" data-tab="items" aria-selected="true">Proof sheet</button>
  <button class="tab" role="tab" data-tab="calibration" aria-selected="false">Calibration</button>
  <button class="tab" role="tab" data-tab="cost" aria-selected="false">Cost</button>
  <button class="tab" role="tab" data-tab="review" aria-selected="false">Review queue</button>
  <button class="tab" role="tab" data-tab="diff" aria-selected="false">Diff</button>
</nav>

<main id="main">
  <section id="tab-items" class="panel" role="tabpanel">
    <div class="heatmap-wrap">
      <h2>Recall by language × category</h2>
      <div id="heatmap" class="heatmap" role="img" aria-label="Recall heatmap by language and category"></div>
      <p class="hint" id="heatmap-hint"></p>
    </div>
    <div class="filterbar" role="region" aria-label="Filters">
      <input type="search" id="f-search" placeholder="Search id or text…" aria-label="Search">
      <select id="f-lang" aria-label="Language"></select>
      <select id="f-category" aria-label="Category"></select>
      <select id="f-severity" aria-label="Severity">
        <option value="">All severities</option><option>critical</option><option>major</option><option>minor</option>
      </select>
      <select id="f-status" aria-label="Status">
        <option value="">All statuses</option><option>flagged</option><option>uncertain</option><option>clean</option><option>skipped</option>
      </select>
      <label class="chk"><input type="checkbox" id="f-disagree"> judge≠checks</label>
      <span class="count" id="result-count"></span>
      <button class="btn ghost" id="f-reset">reset</button>
    </div>
    <ol class="items" id="item-list" aria-label="Scored items"></ol>
  </section>

  <section id="tab-calibration" class="panel" role="tabpanel" hidden></section>
  <section id="tab-cost" class="panel" role="tabpanel" hidden></section>
  <section id="tab-review" class="panel" role="tabpanel" hidden></section>
  <section id="tab-diff" class="panel" role="tabpanel" hidden></section>
</main>

<aside id="proof" class="drawer" role="dialog" aria-modal="true" aria-label="Item proof sheet" hidden>
  <div class="drawer-head">
    <div><span id="proof-id" class="proof-id"></span> <span id="proof-lang" class="chip"></span> <span id="proof-status" class="chip"></span></div>
    <div class="drawer-nav">
      <button class="btn ghost" id="proof-prev" title="Previous (k)">↑</button>
      <button class="btn ghost" id="proof-next" title="Next (j)">↓</button>
      <button class="btn" id="proof-close" title="Close (Esc)">✕</button>
    </div>
  </div>
  <div class="drawer-body" id="proof-body"></div>
</aside>
<div id="scrim" class="scrim" hidden></div>

<div id="help" class="help" hidden role="dialog" aria-label="Keyboard shortcuts">
  <h3>Shortcuts</h3>
  <ul>
    <li><kbd>j</kbd> / <kbd>k</kbd> — next / previous item</li>
    <li><kbd>Esc</kbd> — close</li>
    <li><kbd>/</kbd> — focus search</li>
    <li><kbd>t</kbd> — toggle theme</li>
  </ul>
  <button class="btn" id="help-close">close</button>
</div>

<footer class="foot">
  <span>AI-generated audio is never committed. Markdown/LaTeX shown as plain text.</span>
  <span id="foot-meta"></span>
</footer>

<script>"use strict";
(function () {

  // ---------- helpers ----------

  // ---------- KPIs ----------

    g.appendChild(ce("i", { style: "width:" + (fill * 100).toFixed(1) + "%" }));
    g.appendChild(ce("span", { class: "tick", style: "left:" + (target * 100).toFixed(1) + "%", title: "target" }));
    return ce("div", { class: "kpi" }, [
      ce("div", { class: "label", text: label }),
      ce("div", { class: "value", text: value == null ? "—" : fmtPct(value) }),
      ce("div", { class: "target", text: "target " + (higherBetter ? "≥ " : "≤ ") + fmtPct(target) }),
      g

  }
  function renderKpis() {

    var jc = SUMMARY.judge_consistency || {};

  // ---------- heatmap ----------

    return "hsl(" + hue + ",48%,42%)";
  }
  function renderHeatmap() {
    var cells = CAL.cells || {};
    var langs = Object.keys(SUMMARY.by_language || {}).sort();
    var cats = {};
    Object.keys(cells).forEach(function (k) { var c = cells[k]; if (c.lang !== "_all" && c.category !== "_all") cats[c.category] = 1; });
    var catList = Object.keys(cats).sort();
    var hm = $("#heatmap");
    if (!langs.length || !catList.length) { $("#heatmap-hint").textContent = "No labelled cells to chart (run with --calibration or labelled items)."; return; }
    hm.style.gridTemplateColumns = "90px repeat(" + catList.length + ",1fr)";

        }, [c ? (recall == null ? "·" : fmtNum(recall)) : ""]);

  }
  function populateSelects() {

  }
  function matches(it) {
    if (state.lang && it.lang !== state.lang) return false;
    if (state.status && it.status !== state.status) return false;

    if (state.category) {
      var has = (it.flags || []).some(function (f) { return f.category === state.category; })
        || (it.uncertain_categories || []).indexOf(state.category) >= 0;
      if (!has) return false;
    }
    if (state.severity) {
      if (!(it.flags || []).some(function (f) { return f.severity === state.severity; })) return false;
    }
    if (state.search) {
      var q = state.search.toLowerCase();
      var hay = (it.id + " " + it.source + " " + it.translation).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  }
  function filtered() { return ITEMS.filter(matches); }

  function fchip(f) {
    return ce("span", { class: "fchip " + f.severity, title: "confidence " + fmtNum(f.confidence) },
      [ce("span", { class: "dot" }), f.category]);
  }
  function renderList() {
    var list = $("#item-list"); list.textContent = "";

    rows.forEach(function (it) {

      }, [

        ce("span", { class: "chip", lang: it.lang, text: it.lang }),
        ce("span", { class: "status " + it.status, text: it.status }),

        ce("span", { class: "cost", text: "₹" + (it.cost_inr || 0) })

  function setFilter(key, val) {
    state[key] = val;
    var map = { search: "#f-search", lang: "#f-lang", category: "#f-category", severity: "#f-severity", status: "#f-status" };

  }
  function syncHash() {
    var parts = [];
    ["lang", "category", "severity", "status", "search"].forEach(function (k) { if (state[k]) parts.push(k + "=" + encodeURIComponent(state[k])); });
    if (state.disagree) parts.push("disagree=1");
    history.replaceState(null, "", parts.length ? "#" + parts.join("&") : "#");
  }
  function readHash() {
    var h = (location.hash || "").replace(/^#/, "");
    if (!h) return;
    h.split("&").forEach(function (p) {
      var kv = p.split("="); var k = kv[0], v = decodeURIComponent(kv[1] || "");
      if (k === "disagree") state.disagree = v === "1";
      else if (k in state) state[k] = v;
    });
    ["search:#f-search", "lang:#f-lang", "category:#f-category", "severity:#f-severity", "status:#f-status"].forEach(function (m) {
      var a = m.split(":"); if ($(a[1])) $(a[1]).value = state[a[0]];
    });
    $("#f-disagree").checked = state.disagree;
  }
  function wireFilters() {
    $("#f-search").addEventListener("input", function (e) { state.search = e.target.value; syncHash(); renderList(); });
    ["lang", "category", "severity", "status"].forEach(function (k) {
      $("#f-" + k).addEventListener("change", function (e) { state[k] = e.target.value; syncHash(); renderList(); });
    });
    $("#f-disagree").addEventListener("change", function (e) { state.disagree = e.target.checked; syncHash(); renderList(); });
    $("#f-reset").addEventListener("click", function () {
      state = { search: "", lang: "", category: "", severity: "", status: "", disagree: false };
      ["#f-search", "#f-lang", "#f-category", "#f-severity", "#f-status"].forEach(function (s) { $(s).value = ""; });
      $("#f-disagree").checked = false; syncHash(); renderList();
    });
  }

  // ---------- proof sheet ----------
  var proofOrder = [];
  function highlight(text, spans) {
    var host = ce("div", { class: "texthost" });
    if (!text) { host.textContent = "(empty)"; return host; }
    var valid = (spans || []).filter(function (s) { return s.span && s.span[1] > s.span[0] && s.span[0] >= 0; })
      .sort(function (a, b) { return a.span[0] - b.span[0]; });
    var pos = 0;
    valid.forEach(function (s) {
      var a = Math.max(pos, s.span[0]), b = Math.min(text.length, s.span[1]);
      if (b <= pos) return; // overlap: skip
      if (a > pos) host.appendChild(document.createTextNode(text.slice(pos, a)));
      var m = ce("mark", { class: s.severity }, [text.slice(a, b)]);
      m.appendChild(ce("span", { class: "marker", text: "[" + s.idx + "]" }));
      host.appendChild(m);
      pos = b;
    });
    if (pos < text.length) host.appendChild(document.createTextNode(text.slice(pos)));
    return host;
  }
  function evidenceCard(f, idx) {
    var head = ce("div", { class: "evhead" }, [

      ]);
      card.appendChild(line);
      if (e.explanation) card.appendChild(ce("div", { text: e.explanation }));
      var det = ce("details", {}, [ce("summary", { text: "evidence" }),

      card.appendChild(det);

    return card;
  }

    if (it.reference) {
      var rh = highlight(it.reference, []); rh.setAttribute("lang", it.lang); rh.className = "texthost indic";
      body.appendChild(ce("div", { class: "textcard" }, [ce("h4", { text: "Reference" }), rh]));
    }
    var wave = waveform(it.signal);
    if (wave) body.appendChild(ce("div", { class: "textcard" }, [ce("h4", { text: "Audio energy" }), wave]));

    body.appendChild(ce("p", { class: "why", text: whyLine(it) }));
    if (it.judge_verdict) body.appendChild(ce("p", { class: "why", text: "Judge verdict: " + it.judge_verdict + (it.checker_disagreement ? " (disagrees with checks)" : "") }));

    (it.flags || []).forEach(function (f, i) { body.appendChild(evidenceCard(f, i + 1)); });
    (it.uncertain_categories || []).forEach(function (c) {
      body.appendChild(ce("div", { class: "evcard" }, [ce("div", { class: "evhead" }, [ce("span", { class: "cat", text: c + " — uncertain" })])]));
    });

    $("#proof").hidden = false; $("#scrim").hidden = false;
    $("#proof-close").focus();
  }
  function closeProof() { $("#proof").hidden = true; $("#scrim").hidden = true; }
  function stepProof(d) {
    var cur = $("#proof-id").textContent;
    var i = proofOrder.indexOf(cur);
    if (i < 0) return;
    var j = i + d;
    if (j >= 0 && j < proofOrder.length) openProof(proofOrder[j]);
  }

  // ---------- tabs ----------
  function switchTab(name) {
    document.querySelectorAll(".tab").forEach(function (t) { t.setAttribute("aria-selected", t.dataset.tab === name ? "true" : "false"); });
    document.querySelectorAll(".panel").forEach(function (p) { p.hidden = p.id !== "tab-" + name; });
    if (name === "calibration") renderCalibration();
    if (name === "cost") renderCost();
    if (name === "review") renderReview();
    if (name === "diff") renderDiff();
  }
  function gridTable(headers, rows) {
    var t = ce("table", { class: "grid" });
    t.appendChild(ce("tr", {}, headers.map(function (h) { return ce("th", { text: h }); })));
    rows.forEach(function (r) { t.appendChild(ce("tr", {}, r.map(function (c) { return c instanceof Node ? ce("td", {}, [c]) : ce("td", { text: String(c) }); }))); });
    return t;
  }
  function renderCalibration() {
    var p = $("#tab-calibration"); if (p.dataset.done) return; p.dataset.done = "1";
    var cells = CAL.cells || {};
    var keys = Object.keys(cells).sort();
    if (!keys.length) { p.appendChild(ce("p", { class: "empty", text: "No calibration (no labelled items)." })); return; }
    p.appendChild(ce("h2", { text: "Precision / recall per language × category" }));
    var rows = keys.map(function (k) {
      var c = cells[k];
      return [c.lang, c.category, c.labels, fmtNum(c.recall), fmtNum(c.precision), fmtNum(c.f1),
        fmtNum(c.localization), fmtNum(c.category_accuracy), c.low_support ? "low" : ""];
    });
    p.appendChild(gridTable(["lang", "category", "n", "recall", "precision", "F1", "loc", "cat-acc", "support"], rows));
    var fa = CAL.false_alarms || {};
    p.appendChild(ce("h2", { text: "False-alarm rate (clean items flagged)" }));
    p.appendChild(gridTable(["lang", "clean", "flagged", "rate"],
      Object.keys(fa).sort().map(function (l) { return [l, fa[l].clean_items, fa[l].flagged, fmtNum(fa[l].rate)]; })));
  }
  function renderCost() {
    var p = $("#tab-cost"); if (p.dataset.done) return; p.dataset.done = "1";
    var cost = SUMMARY.cost || {};
    p.appendChild(ce("h2", { text: "Cost (logical, cache-independent)" }));
    p.appendChild(ce("p", { text: "Total logical model cost: ₹" + (cost.logical_total_inr != null ? cost.logical_total_inr : "—") + ". A cached rerun costs ₹0 (actual spend is in meta.json)." }));
    var n = (SUMMARY.totals || {}).items || 1;
    var per100 = cost.logical_total_inr != null ? (cost.logical_total_inr / n * 100) : null;
    p.appendChild(gridTable(["metric", "value"], [
      ["items", n], ["₹ this run (logical)", cost.logical_total_inr != null ? cost.logical_total_inr : "—"],
      ["₹ per 100 items (extrapolated)", per100 != null ? per100.toFixed(4) : "—"],
      ["skipped for budget", (SUMMARY.skipped_for_budget || []).length]
    ]));
  }
  function renderReview() {
    var p = $("#tab-review"); if (p.dataset.done) return; p.dataset.done = "1";
    var unc = ITEMS.filter(function (it) { return it.status === "uncertain"; });
    p.appendChild(ce("h2", { text: "Review queue — " + unc.length + " uncertain item(s)" }));
    p.appendChild(ce("button", { class: "btn", onclick: function () { exportCsv(unc); } }, ["Download filtered CSV"]));
    if (!unc.length) { p.appendChild(ce("p", { class: "empty", text: "Nothing to review." })); return; }
    p.appendChild(gridTable(["id", "lang", "uncertain categories", "open"],
      unc.map(function (it) {
        return [it.id, it.lang, (it.uncertain_categories || []).join("; "),
          ce("button", { class: "btn ghost", onclick: function () { openProof(it.id); } }, ["open"])];
      })));
  }
  function exportCsv(rows) {
    var lines = ["id,lang,status,uncertain_categories"];
    rows.forEach(function (it) {
      lines.push([it.id, it.lang, it.status, '"' + (it.uncertain_categories || []).join(";") + '"'].join(","));
    });
    var blob = new Blob([lines.join("\n")], { type: "text/csv" });
    var a = ce("a", { href: URL.createObjectURL(blob), download: "review_queue.csv" });
    document.body.appendChild(a); a.click(); a.remove();
  }
  function renderDiff() {
    var p = $("#tab-diff"); if (p.dataset.done) return; p.dataset.done = "1";
    if (!DIFF) { p.appendChild(ce("p", { class: "empty", text: "No baseline diff (run with --baseline)." })); return; }
    p.appendChild(ce("h2", { text: "Regressions " + (DIFF.regression_count || 0) + " · Improvements " + (DIFF.improvement_count || 0) }));
    p.appendChild(ce("h3", { text: "New flags (regressions)" }));
    p.appendChild(gridTable(["id", "category", "severity"], (DIFF.new_flags || []).map(function (f) { return [f.id, f.category, f.severity]; })));
    p.appendChild(ce("h3", { text: "Resolved flags" }));
    p.appendChild(gridTable(["id", "category", "severity"], (DIFF.resolved_flags || []).map(function (f) { return [f.id, f.category, f.severity]; })));
  }

  // ---------- keyboard ----------
  function onKey(e) {
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") { if (e.key === "Escape") e.target.blur(); return; }
    if (e.key === "Escape") { closeProof(); $("#help").hidden = true; }
    else if (e.key === "j") stepProof(1);
    else if (e.key === "k") stepProof(-1);
    else if (e.key === "/") { e.preventDefault(); $("#f-search").focus(); }
    else if (e.key === "t") toggleTheme();
    else if (e.key === "?") $("#help").hidden = !$("#help").hidden;
  }

  // ---------- init ----------
  function init() {
    initTheme();
    renderHeader(); renderKpis(); renderHeatmap(); populateSelects(); wireFilters();
    readHash(); renderList();
    $("#theme-toggle").addEventListener("click", toggleTheme);
    $("#help-toggle").addEventListener("click", function () { $("#help").hidden = !$("#help").hidden; });
    $("#help-close").addEventListener("click", function () { $("#help").hidden = true; });
    $("#proof-close").addEventListener("click", closeProof);
    $("#scrim").addEventListener("click", closeProof);
    $("#proof-next").addEventListener("click", function () { stepProof(1); });
    $("#proof-prev").addEventListener("click", function () { stepProof(-1); });
    document.querySelectorAll(".tab").forEach(function (t) { t.addEventListener("click", function () { switchTab(t.dataset.tab); }); });
    document.addEventListener("keydown", onKey);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>

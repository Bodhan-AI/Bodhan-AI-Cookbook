[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan_eval"
version = "0.1.0"
description = "Agentic translation and speech quality harness for Bodhan Indic models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40,<2",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "sacrebleu>=2.4,<3",
    "rapidfuzz>=3.9,<4",
    "numpy>=1.26,<3",
    "soundfile>=0.12,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.6,<1",
]

[project.scripts]
bodhan-eval = "bodhan_eval.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bodhan_eval = ["default_config/*.yaml", "default_config/*.json", "dashboard_assets/*", "rubric.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]  # scripts bootstrap sys.path before importing the package

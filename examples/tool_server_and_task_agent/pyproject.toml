[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-tool-server-agent"
version = "0.1.0"
description = "Bodhan AI Cookbook recipe: MCP tool server for Bodhan's Indic models plus a CLI task agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sujal Giri" }]
dependencies = [
    "mcp==1.21.0",
    "httpx==0.28.1",
    "pydantic==2.11.9",
    "PyMuPDF==1.25.5",
    "Pillow==10.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[project.scripts]
bodhan-mcp = "bodhan_mcp.__main__:main"
bodhan-agent = "bodhan_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

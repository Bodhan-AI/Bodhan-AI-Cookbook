[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-eval"
version = "0.1.0"
description = "Translation and speech quality harness for Bodhan Indic-Translate and Indic-Speak"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx==0.28.1",
    "numpy==2.4.6",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
    "regex==2026.11.15",
    "sacrebleu==2.6.0",
    "soundfile==0.14.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[project.scripts]
bodhan-eval = "bodhan_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bodhan_eval = ["*.json"]

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/bodhan_eval/reporting/dashboard.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

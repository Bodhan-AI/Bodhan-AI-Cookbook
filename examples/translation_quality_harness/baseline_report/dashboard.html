ld's first patent issued in the field of MRI.", "status": "scored", "transcript": null, "translation": "## इस अनुनाद में, चुंबकीय क्षेत्र और रेडियो तरंगें परमाणुओं को छोटे रेडियो सिग्नल देने का कारण बनती हैं।\n\nवर्ष 1790 में, एक मेडिकल डॉक्टर और रिसर्च साइंटिस्ट रेमंड डमाडियन ने मेडिकल डायग्नोसिस के लिए एक उपकरण के रूप में मैग्नेटिक रेजोनेंस इमेजिंग का उपयोग करने का आधार खोजा। चार साल बाद एक पेटेंट दिया गया था, जो एमआरआई के क्षेत्र में जारी किया गया दुनिया का पहला पेटेंट था।"}, {"back_translation": "Piquet Jr. crashed out of the 2008 Singapore Grand Prix just after an early pit stop for Fernando Alonso, which led to the safety car being deployed. As cars ahead of Alonso passed under the safety car to refuel, he moved up the pack to win. Piquet Jr. was fired after the 2009 Hungarian Grand Prix.", "error": null, "flags": [], "id": "fl-dev-0031-paragraph", "lang": "hi", "quality_score": 100.0, "source": "Piquet Jr. crashed in the 2008 Singapore Grand Prix just after an early pit stop for Fernando Alonso, bringing out the safety car. As the cars ahead of Alonso went in for fuel under the safety car, he moved up the pack to take victory. Piquet Jr. was sacked after the 2009 Hungarian Grand Prix.", "status": "scored", "transcript": null, "translation": "पिकेत जूनियर ने 2008 सिंगापुर ग्रां प्री में फर्नांडो अलोंसो के लिए एक शुरुआती पिट स्टॉप के ठीक बाद दुर्घटनाग्रस्त हो गया था, जिससे सुरक्षा कार बाहर आ गई। जैसे ही अलोंसो से आगे की कारें ईंधन भरने के लिए सुरक्षा कार के तहत चली गईं, वह जीत हासिल करने के लिए पैक में ऊपर चला गया। पिकेत जूनियर को 2009 हंगेरियन ग्रां प्री के बाद बर्खास्त कर दिया गया था।"}, {"back_translation": "An official from a gas company was reporting to the scene after a neighbor called about a gas leak. When the officer arrived, an explosion occurred in the apartment. No major injuries were reported, but at least five people who were present at the scene at the time of the explosion were treated for shock symptoms.", "error": null, "flags": [], "id": "fl- nd's A1GP car, Black Beauty at speeds over 160km/h seven times over the bridge.", "status": "scored", "transcript": "श्री रीड पुल पर सात बार वन हंड्रेड एंड सिक्सटी किमी घंटा से अधिक की गति से न्यूज़ीलैंड की ए जी पी कार ब्लैक ब्यूटी को चलाने में सफल रहे", "translation": "श्री रीड पुल पर सात बार 160 किमी/घंटा से अधिक की गति से न्यूजीलैंड की ए1जीपी कार, ब्लैक ब्यूटी को चलाने में सफल रहे।"}, {"back_translation": "They are different from lingua franca, which are natural or organic languages that become dominant as a means of communication among speakers of other languages for one reason or another.", "error": null, "flags": [], "id": "fl-dev-0977-sentence", "lang": "hi", "quality_score": 100.0, "source": "They are separate from lingua francas, which are natural or organic languages that become dominant for one reason or another as means of communication between speakers of other languages.", "status": "scored", "transcript": null, "translation": "वे लिङ्गवा फ़्रैंका से अलग हैं, जो प्राकृतिक या जैविक भाषाएँ हैं जो किसी न किसी कारण से अन्य भाषाओं के बोलने वालों के बीच संचार के साधन के रूप में प्रमुख हो जाती हैं।"}, {"back_translation": "Former Speaker of the US House, Newt Gingrich came in second with 32 percent of the vote.", "error": null, "flags": [], "id": "fl-dev-0278-sentence.hi", "lang": "hi", "quality_score": 100.0, "source": "Former U.S. Speaker of the House Newt Gingrich came in second with 32 percent.", "status": "scored", "transcript": null, "translation": "अमेरिकी सदन के पूर्व अध्यक्ष न्यूट गिंगरिच 32 प्रतिशत मतों के साथ दूसरे स्थान पर रहे।"}, {"back_translation": "Seeing this activity, the colonists also demanded additional troops. The soldiers who reinforced the advance positions included the First and Third New Hampshire Regiments of 201 men each under Colonel John Stark and James Reed (both later generals). Stark's men took up positions along the fence at the northern end of the colonial position.", "error": null, "flags": [{"audio_span": null, "category": ls (2.3 million gallons).", "status": "scored", "transcript": null, "translation": "अलास्का के फेयरबैंक्स के दक्षिण में कच्चे तेल के हजारों बैरल फैलने के बाद ट्रांस-अलास्का पाइपलाइन सिस्टम के 800 मील लंबे हिस्से को बंद कर दिया गया। एक नियमित फायर-कमांड सिस्टम परीक्षण के बाद बिजली गुल होने से रिलीफ वाल्व खुल गए और फोर्ट ग्रीली पंप स्टेशन 9 के पास कच्चा तेल बह गया। वाल्व खुलने से सिस्टम के लिए दबाव कम हो गया और तेल एक पैड पर बहकर एक टैंक में चला गया जिसमें 55,000 बैरल (2.3 मिलियन गैलन) आ सकते हैं।"}, {"back_translation": "The postmodern approach to learning offers liberation from absolutes. There is no single good way to learn. In fact, there is no one good thing to learn. Learning occurs in the space created between the learner and the knowledge being presented. Our current experience with all-do-it-yourself and information-presenting, learning-based television shows reflects this.", "error": null, "flags": [], "id": "fl-dev-0644-paragraph", "lang": "hi", "quality_score": 100.0, "source": "The postmodern approach to learning offers the freedom from absolutes. There is no one good way to learn. In fact, there is not one good thing to learn.Learning takes place in the experience between the learner and the knowledge presented. Our current experience with all the do-it-yourself and information presenting, learning-based television shows illustrates this point.", "status": "scored", "transcript": null, "translation": "सीखने के लिए उत्तर आधुनिक दृष्टिकोण निरपेक्षता से मुक्ति प्रदान करता है। सीखने का कोई एक अच्छा तरीका नहीं है। वास्तव में, सीखने के लिए कोई एक अच्छी चीज़ नहीं है। सीखना शिक्षार्थी और प्रस्तुत ज्ञान के बीच के बनाया में होता है। सभी स्वयं करें और जानकारी प्रस्तुत करने वाले, सीखने-आधारित टेलीविजन शो के साथ हमारा वर्तमान अनुभव इस बात को दर्शाता है।"}, {"back_translation": "| # | ¶ |\n|---|---|\n| 1 | On September 24, 1759, Arthur Guinness signed a 9,000-year lease for the St James's Gate Brewery in Dublin, Ireland. |\n| 2 | 250 years later, Guinness has grown in tus": "scored", "transcript": null, "translation": "அமெரிக்கா மற்றும் கனடா போன்ற சில கூட்டாட்சி நாடுகளில், வருமான வரி மத்திய அரசிலும் உள்ளூர் அரசிலும் விதிக்கப்படுகிறது, எனவே விகிதங்களும் வரம்புகளும் பிராந்தியத்திற்கு பிராந்தியம் மாறுபடலாம். ($v = u + at)"}, {"back_translation": "Of the approximately 24,000 meteorites known to have fallen on Earth, only about 34 have been confirmed to be from Mars.", "error": null, "flags": [], "id": "fl-dev-0154-sentence", "lang": "ta", "quality_score": 100.0, "source": "Out of the approximately 24,000 known meteorites to have fallen to Earth, only about 34 have been verified to be martian in origin.", "status": "scored", "transcript": "பூமியில் விழுந்ததாக அறியப்பட்ட சுமார் ட்வென்டி ஃபோர் தௌசண்ட் விண்கற்களில் சுமார் தேர்ட்டி ஃபோர் மட்டுமே செவ்வாய் கிரகத்தில் இருந்து வந்தவை என்று உறுதிப்படுத்தப்பட்டுள்ளன", "translation": "பூமியில் விழுந்ததாக அறியப்பட்ட சுமார் 24,000 விண்கற்களில், சுமார் 34 மட்டுமே செவ்வாய் கிரகத்தில் இருந்து வந்தவை என்று உறுதிப்படுத்தப்பட்டுள்ளன."}, {"back_translation": "| # | Paragraph |\n|---|---|\n| 1 | Certainly a first-rate half-mile runner, one who can finish in under two minutes, must have sufficient speed, but endurance must be developed in all ways. |\n| 2 | Some cross country running in winter, combined with exercises for the upper part of the body, is an excellent preparation for the racing season. |", "error": null, "flags": [], "id": "fl-dev-0549-table", "lang": "ta", "quality_score": 100.0, "source": "| # | ¶ |\n|---|---|\n| 1 | Of course a first-class half-miler, a man who can beat two minutes, must be possessed of a fair amount of speed, but endurance must be cultivated at all hazards. |\n| 2 | Some cross country running during the winter, combined with gymnasium work for the upper part of the body, is the best preparation for the running season. |", "status": "scored", "transcript": null, "translation": "| # | பத்தி |\n|---|---|\n| 1 | நிச்சயமாக ஒரு முதல் தர அரை மைல் ஓட்டப்பந்தய வீரர், இரண்டு நிமிடங்களுக்குள் முடிக்கக்கூடிய ஒருவர், போதுமான வேகத்தைக் கொண்டிருக்க வேண்டும், ஆனால் சகிப்புத்தன்மை எல்லா வகையிலும் வளர்க்கப்பட வேண்டும். |\n| 2 | குளிர்காலத்தில் சில குறுக்கு நாடு ஓட்டம், உடலின் மேல் பகுதிக்கு உடற்பயிற்சி கூட வேலைகளுடன் இணைந்து, ஓட்டப்பந்தய சீசனுக்கு சிறந்த தயாரிப்பாகும். |"}, {"back_translation": "Beijing, China will be the host city for the 2022 Winter Olympics, making it the first city to host both the Summer and Winter Olympics.", "error": null, "flags": [], "id": "fl-dev-0766-sentence", "lang": "ta", "quality_score": 100.0, "source": "The city of Beijing in China will be the host city of the Olympic Winter Games in 2022, which will make it the first city to have hosted both the summer and winter Olympics.", "status": "scored", "transcript": null, "translation": "சீனாவின் பெய்ஜிங் நகரம் 2022ஆம் ஆண்டு குளிர்கால ஒலிம்பிக் போட்டிகளை நடத்தும் நகரமாக இருக்கும், இதன் மூலம் கோடைக்கால மற்றும் குளிர்கால ஒலிம்பிக் இரண்டையும் நடத்திய முதல் நகரம் டிஸ்னி பெருமையை அது பெறும்."}, {"back_translation": "## These plants look like a small palm tree with a crown of sharp, spiky leaves.\nA Triceratops may have used its powerful beak to strip the leaves before eating the stems. Other scientists argue that these plants were too toxic for any dinosaur to eat, although today other animals such as sloths and parrots (descendants of dinosaurs) can eat the toxic leaves or fruit.", "error": null, "flags": [], "id": "fl-dev-0370-heading", "lang": "ta", "quality_score": 100.0, "source": "## These plants look like a small palm tree with a crown of sharp, spiky leaves.\n\nA Triceratops could have used its strong beak to strip off the leaves before eating the trunk. Other scientists argue that these plants are very poisonous so it is unlikely that any dinosaur ate them, even though today the sloth and other animals like the parrot (a descendant of the dinosaurs) can eat poisonous leaves or fruit.", "status": "scored", "transcript": null, "translation": "## இந்தத் தாவரங்கள் கூர்மையான evidence": ["[format] structure mismatch: source has list item; translation has nothing"], "judge": null, "severity": "major", "source_span": [270, 391], "span": [421, 421]}], "id": "fl-dev-0437-list", "lang": "ta", "quality_score": 92.42, "source": "- It is said that in 1649, Zhabdrung Ngawang Namgyel created the fortress to commemorate his victory against the Tibetan-Mongol forces.\n- In 1951, a fire caused for only some of the relics of the Drukgyal Dzong to remain, such as the image of Zhabdrung Ngawang Namgyal.\n- After the fire, the fortress was preserved and protected, remaining to be one of Bhutan's most sensational attractions.", "status": "scored", "transcript": null, "translation": "- 1649 ஆம் ஆண்டில் ஜாப்ட்ருங் நவாங் நம்கியெல் திபெத்திய-மங்கோலியப் படைகளுக்கு எதிரான தனது வெற்றியை நினைவுகூரும் வகையில் இந்த கோட்டையை உருவாக்கினார் என்று கூறப்படுகிறது. 1951 இல் ஏற்பட்ட தீ விபத்தில் ட்ருக்யால் சோங்கின் சில எச்சங்கள் மட்டுமே எஞ்சியுள்ளன, அதாவது ஜாப்ட்ருங் நவாங் நம்கியலின் உருவம்.\n- தீ விபத்துக்குப் பிறகு, இந்த கோட்டை பாதுகாக்கப்பட்டது மற்றும் பாதுகாக்கப்பட்டு, பூட்டானின் மிகவும் பரபரப்பான இடமாக உள்ளது."}, {"back_translation": "Glasses may be cheaper in foreign countries, especially those with low labor costs.", "error": null, "flags": [], "id": "fl-dev-0804-sentence", "lang": "ta", "quality_score": 100.0, "source": "Eyeglasses can be cheaper in a foreign country, especially in low-income countries where labour costs are lower.", "status": "scored", "transcript": null, "translation": "வெளிநாடுகளில் குறிப்பாக குறைந்த வருமானம் கொண்ட நாடுகளில் தொழிலாளர் செலவுகள் குறைவாக இருப்பதால் கண்ணாடிகள் மலிவாகக் கிடைக்கலாம்."}, {"back_translation": "| # | Paragraph |\n| 1 | Individuals who have been involved for decades helped us to realize our strengths and passions when they openly assessed the struggles and failures. |\n| 2 | When we heard individuals share their personal, family, and organizational stories, we gained valuable insight into the past and some of the personal nces of chronic pain and discomfort feel from normal physical movement.", "status": "scored", "transcript": null, "translation": "மனச்சோர்வு மற்றும் பயம் அல்லாமல் பேரழிவு விளைவுகளின் விளைவுகள் மட்டுமே வழக்கமான வாராந்திர கட்டமைக்கப்பட்ட பிஏ அமர்வுகளின் நிபந்தனையாக இருந்தது. வழக்கமான செயல்பாட்டில் பங்கேற்பவர்கள் நாள்பட்ட வலி மற்றும் அசௌகரிய உணர்வு சாதாரண உடல் இயக்கத்திலிருந்து வேறுபடுவதை வேறுபடுத்திப் பார்ப்பதில் எதிர்மறை கருத்தின் அடிப்படையில் அதிக ஆதரவு தேவைப்பட்டது."}, {"back_translation": "The Temple of Artemis at Ephesus was burned on July 21, 356 BC by Herostratus, who is said to have done so in order to gain fame at any cost. The Ephesians were outraged and declared that Herostratus' name should never be recorded. Greek historian Strabo later mentioned the name, which is what we know today. The temple was destroyed on the night of Alexander the Great's birth.", "error": null, "flags": [{"audio_span": null, "category": "omission", "confidence": 0.464, "evidence": ["[back_translation] source clause barely appears in the back-translation (coverage 20%)"], "judge": null, "severity": "major", "source_span": [59, 111], "span": null}], "id": "fl-dev-0474-paragraph", "lang": "ta", "quality_score": 92.86, "source": "The temple of Artemis at Ephesus was destroyed on July 21, 356 BCE in an act of arson committed by Herostratus. According to the story, his motivation was fame at any cost. The Ephesians, outraged, announced that Herostratus' name never be recorded. The Greek historian Strabo later noted the name, which is how we know today. The temple was destroyed on the same night that Alexander the Great was born.", "status": "scored", "transcript": null, "translation": "எபேசுவில் இருந்த ஆர்டெமிஸ் கோயில் கி.மு. 356 ஜூலை 21 அன்று ஹெரோஸ்ட்ராடஸ் என்பவனால் எரிக்கப்பட்டது. எந்த விலை கொடுத்தாவது புகழ் பெற வேண்டும் என்பதுதான் அவனுடைய நோக்கம் என்று கூறப்படுகிறது. இதனால் கோபமடைந்த எபேசியர்கள், ஹெரோஸ்ட்ராடஸின் பெயரை ஒருபோதும் பதிவு செய்யக்கூடாது என்று அறிவித்தனர். கிரேக்க வரலாற்றாசிரியர் ஸ்ட்ராபோ பின்னர் அந்தப் பெயரை குறிப்பிட்டார். அதுவே இன்று நமக்குத் தெரிந்த பெயர். அலெக்சாண்டர் பேரரசர் பிறந்த இரவிலேயே இந்தக் கோயில் அழிக்கப்பட்டது."}, {"back_translation": "They include financial sanctions and a European Union ban on crude oil exports, from which the Iranian economy derives 80% of its foreign income.\n\n$$PV = nRT$$", "error": null, "flags": [], "id": "fl-dev-0104-latex", "lang": "ta", "quality_score": 100.0, "source": "They include financial restrictions and a ban by the European Union on the export of crude oil, from which the Iranian economy receives 80% of its foreign income.\n\n$$PV = nRT$$", "status": "scored", "transcript": null, "translation": "அவை நிதி கட்டுப்பாடுகள் மற்றும் ஐரோப்பிய ஒன்றியத்தால் கச்சா எண்ணெய் ஏற்றுமதிக்கு விதிக்கப்பட்ட தடை ஆகியவை அடங்கும், அதிலிருந்து ஈரானிய பொருளாதாரம் அதன் வெளிநாட்டு வருமானத்தில் 80% பெறுகிறது.\n\n$$PV = nRT$$"}, {"back_translation": "When a gap was opened in the Mastic River northeast of the peninsula during low tide, they quickly extended the fence north with a small stone wall and ended it at the edge of the water on a small beach. Gready or Stark placed a bar in front of about 100 feet (30 m) of the fence and ordered that no one shoot until the usual passerby had passed.", "error": null, "flags": [], "id": "fl-dev-0542-paragraph", "lang": "ta", "quality_score": 100.0, "source": "When low tide opened a gap along the Mystic River along the northeast of the peninsula, they quickly extended the fence with a short stone wall to the north ending at the water's edge on a small beach. Gridley or Stark placed a stake about 100 feet (30 m) in front of the fence and ordered that no one fire until the regulars passed it.", "status": "scored", "transcript": null, "translation": "குறைந்த அலைகளின் போது தீபகற்பத்தின் வடகிழக்கில் உள்ள மஸ்டிக் நதியில் ஒரு இடைவெளி திறக்கப்பட்டபோது, அவர்கள் விரைவாக ஒரு சிறிய கல் சுவருடன் வேலியை வடக்கே நீட்டித்து ஒரு சிறிய கடற்கரையில் நீரின் விளிம்பில் முடித்தனர். கிரிட்லி அல்லது ஸ்டார்க் சுமார் 100 அடி (30 மீ) வேலியின் முன் ஒரு கம்பை வைத்து, வழக்கமானவர்கள் கடந்து செல்லும் வரை யாரும் சுடக்கூடாது என்று உத்தரவிட்டார்."}, {"back_translation": "At 1.15 am on Saturday, according to witnesses, the car turned in front of a bus that was going through a green light.", "error": null, "flags": [{"audio_span": null, "category": "number", "confidence": 0.9, "evidence": ["[numbers] source number 1 appears as 1.15 in the translation"], "judge": null, "severity": "major", "source_span": [3, 4], "span": [19, 23]}], "id": "fl-dev-0187-sentence", "lang": "ta", "quality_score": 80.0, "source": "At 1:15 a.m. Saturday, according to witnesses, the bus was going through a green light when the car made a turn in front of it.", "status": "scored", "transcript": null, "translation": "சனிக்கிழமை அதிகாலை 1.15 மணிக்கு, சாட்சிகளின் கூற்றுப்படி, பேருந்து ஒரு பச்சை விளக்கு வழியாகச் சென்றுகொண்டிருந்தபோது கார் அதன் முன் திரும்பியது."}, {"back_translation": "## Due to submarine fiber optic cable connections and broadband limits and connectivity for Europe, Greenland is well connected and 93% of its population has internet access.\nYour hotel or hosts (if staying in a guesthouse or private home) will likely have a computer with wifi or internet connection, and there are some places where all apartments have an internet cafe or public wifi. As mentioned above, while the term \"eskimo\" is acceptable in the US, it is considered derogatory by many Arctic people not from the US, especially in Canada.", "error": null, "flags": [], "id": "fl-dev-0649-heading", "lang": "ta", "quality_score": 100.0, "source": "## Thanks to undersea fiber optic cable links to Europe and broadband satellite, Greenland is well connected with 93% of the population having internet access.\n\nYour hotel or hosts (if staying in a guesthouse or private home) will likely have wifi or an internet connected PC, and all settlements have an internet cafe or some location with public wifi. As mentioned above, though the word \"Eskimo\" remains acceptable in the United States, it is considered pejorative by many non-U.S. Arctic peoples, especially in Canada.", "status": "scored", "transcript": null, "translation": "## ஐரோப்பாவிற்கான கடலுக்கடியில் உள்ள ஃபைபர் ஆப்டிக் கேபிள் இணைப்புகள் மற்றும் பிராட்பேண்ட் வரம்புகளும் இணைப்பு ஆகியவற்றின் காரணமாக, கிரீன்லாந்து நன்கு இணைக்கப்பட்டுள்ளது, மேலும் அதன் மக்கள் தொகையில் 93% பேர் இணைய வசதியைப் பெற்றுள்ளனர்.\n\nஉங்கள் தங்கும் விடுதி அல்லது புரவலர்கள் (ஒரு விருந்தினர் இல்லம் அல்லது தனிப்பட்ட வீட்டில் தங்கியிருந்தால்) வைஃபை அல்லது இணையத்துடன் இணைக்கப்பட்ட கணினியைக் கொண்டிருக்க வாய்ப்புள்ளது, மேலும் அனைத்து குடியிருப்புகளிலும் ஒரு இணைய கஃபே அல்லது பொது வைஃபை வசதி உள்ள சில இடங்கள் உள்ளன. மேலே குறிப்பிட்டுள்ளபடி, அமெரிக்காவில் \"எஸ்கிமோ\" என்ற சொல் ஏற்றுக்கொள்ளத்தக்கதாக இருந்தாலும், இது அமெரிக்காவைச் சாராத பல ஆர்க்டிக் மக்களால், குறிப்பாக கனடாவில் இழிவாகக் கருதப்படுகிறது."}, {"back_translation": "In the last 3 months, more than 80 arrested people were released from Central Booking without a formal charge being filed.", "error": null, "flags": [], "id": "fl-dev-0050-sentence", "lang": "ta", "quality_score": 100.0, "source": "In the last 3 months, over 80 arrestees were released from the Central Booking facility without being formally charged.", "status": "scored", "transcript": "கடந்த த்ரீ மாதங்களில் மத்திய முன்பதிவு வசதியிலிருந்து ஐடிக்கும் மேற்பட்ட கைது செய்யப்பட்டவர்கள் முறையான குற்றச்சாட்டு பதிவு செய்யப்படாமலேயே விடுவிக்கப்பட்டனர்", "translation": "கடந்த 3 மாதங்களில், மத்திய முன்பதிவு வசதியிலிருந்து 80க்கும் மேற்பட்ட கைது செய்யப்பட்டவர்கள் முறையான குற்றச்சாட்டு பதிவு செய்யப்படாமலேயே விடுவிக்கப்பட்டனர்."}, {"back_translation": "It has the same molecular structure whether it is a gas, liquid or solid.", "error": null, "flags": [], "id": "fl-dev-0603-sentence", "lang": "ta", "quality_score": 100.0, "source": "It has the same molecular structure whether it is a gas, liquid, or solid.", "status": "scored", "transcript": "இது வாயு பரவம் அல்லது திடப்பொருளாக இருந்தாலும் ஒரே மூலக்கூறு அமைப்பைக் கொண்டுள்ளது", "translation": "இது வாயு, திரவம் அல்லது திடப்பொருளாக இருந்தாலும் ஒரே மூலக்கூறு அமைப்பைக் கொண்டுள்ளது."}, {"back_translation": "Children with ADD have difficulty focusing on things like schoolwork, but they can focus on things they enjoy, such as playing games or watching their favorite cartoons, or writing sentences without punctuation. These children get involved in a lot of problems because they \"get into dangerous activities, get into fights, and resist authority\" to stimulate their brains, as their brains cannot be stimulated by normal methods. ADD affects relationships with other peers because other children cannot understand why they act the way they do, or why they write the way they do, or why their level of maturity is different.", "error": null, "flags": [], "id": "fl-dev-0510-paragraph", "lang": "ta", "quality_score": 100.0, "source": "Children with ADD have a hard time focusing on things like school work, but they can concentrate on things they enjoy doing like playing games or watching their favorite cartoons or writing sentences without punctuation. These children tend to get into a lot of trouble, because they \"engage in risky behaviors, get into fights, and challenge authority\" in order to stimulate their brain, since their brain can not be stimulated by normal methods. ADD affects relationships with other peers because other children can not understand why they act the way that they do or why they spell they way they do or that their maturity level is different.", "status": "scored", "transcript": null, "translation": "ADD உள்ள குழந்தைகள் பள்ளி வேலைகள் போன்ற விஷயங்களில் கவனம் செலுத்துவதில் சிரமம் அடைகிறார்கள், ஆனால் அவர்கள் விளையாடுவது அல்லது அவர்களுக்குப் பிடித்த கார்ட்டூன்களைப் பார்ப்பது அல்லது நிறுத்தற்குறைகள் இல்லாமல் வாக்கியங்களை எழுதுவது போன்ற அவர்கள் விரும்பும் விஷயங்களில் கவனம் செலுத்த முடியும். இந்த குழந்தைகள் நிறைய பிரச்சனைகளில் ஈடுபடுகிறார்கள், ஏனென்றால் அவர்களின் மூளையைத் தூண்டுவதற்கு அவர்கள் \"ஆபத்தான செயல்களில் ஈடுபடுகிறார்கள், சண்டைகளில் இறங்குகிறார்கள், அதிகாரத்தை எதிர்க்கிறார்கள்\", ஏனெனில் அவர்களின் மூளையை சாதாரண முறைகளால் தூண்ட முடியாது. ADD மற்ற சக மாணவர்களுடனான உறவுகளை பாதிக்கிறது, ஏனென்றால் மற்ற குழந்தைகள் அவர்கள் ஏன் அப்படி நடந்துகொள்கிறார்கள் அல்லது அவர்கள் ஏன் அப்படி எழுதுகிறார்கள் அல்லது அவர்களின் முதிர்ச்சி நிலை ஏன் வேறுபட்டது என்பதைப் புரிந்து கொள்ள முடியாது."}, {"back_translation": "About three thousand years later, in 16100, the Italian astronomer Galileo Galilei used a telescope to observe that Venus has different phases, just like the moon. These phases occur because only the side of Venus (or the moon) facing the sun is illuminated. The phases of Venus supported Copernicus's theory that planets orbit the sun.", "error": null, "flags": [], "id": "fl-dev-0378-paragraph", "lang": "ta", "quality_score": 100.0, "source": "About three thousand years later, in 1610, Italian astronomer Galileo Galilei used a telescope to observe that Venus has phases, just as the moon does. Phases happen because only the side of Venus (or of the Moon) facing the Sun is lighted. The phases of Venus supported the theory of Copernicus that the planets go around the Sun.", "status": "scored", "transcript": null, "translation": "சுமார் மூவாயிரம் ஆண்டுகளுக்குப் பிறகு, 16100 ஆம் ஆண்டில், இத்தாலிய வானியலாளர் கலிலியோ கலிலி ஒரு தொலைநோக்கியைப் பயன்படுத்தி, சந்திரன் போலே வெள்ளியும் வெவ்வேறு நிலைகளைக் கொண்டுள்ளது என்பதை கவனித்தார். சூரியனை நோக்கிய வெள்ளியின் (அல்லது சந்திரனின்) பக்கம் மட்டுமே ஒளியூட்டப்படுவதால் இந்த நிலைகள் ஏற்படுகின்றன. கோள்கள் சூரியனைச் சுற்றி வருகின்றன என்ற கோப்பர்நிக்கஸின் கோட்பாட்டை வெள்ளியின் நிலைகள் ஆதரித்தன."}, {"back_translation": "It gives a resolution of about 35 mm negative (3136 mm2 vs. 864). ($F = ma$)", "error": null, "flags": [], "id": "fl-dev-0780-latex", "lang": "ta", "quality_score": 100.0, "source": "This gives resolution almost four times that of a 35 mm negative (3136 mm2 versus 864). ($F = ma$)", "status": "sco <script>
const items = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fill(sel, values){ [...new Set(values)].sort().forEach(v => { const o = document.createElement('option'); o.textContent = v; sel.appendChild(o); }); }
fill($('lang'), items.map(i => i.lang));
fill($('cat'), items.flatMap(i => i.flags.map(f => f.category)));
function highlight(text, span){ if(!text) return ''; if(!span) return esc(text); return esc(text.slice(0, span[0])) + '<mark>' + esc(text.slice(span[0], span[1])) + '</mark>' + esc(text.slice(span[1])); }
function render(){
  const lang = $('lang').value, cat = $('cat').value, sev = $('sev').value, st = $('status').value, q = $('q').value.toLowerCase();
  const shown = items.filter(i => {
    if (lang && i.lang !== lang) return false;
    const flags = i.flags.filter(f => (!cat || f.category === cat) && (!sev || f.severity === sev));
    if ((cat || sev) && !flags.length) return false;
    if (st === 'flagged' && !i.flags.length) return false;
    if (st === 'clean' && (i.flags.length || i.status !== 'scored')) return false;
    if (st === 'failed' && i.status === 'scored') return false;
    if (q && !JSON.stringify(i).toLowerCase().includes(q)) return false;
    return true;
  });
  $('stats').innerHTML = `<div class="stat"><b>${shown.length}</b>items shown</div><div class="stat"><b>${shown.filter(i=>i.flags.length).length}</b>flagged</div><div class="stat"><b>${shown.reduce((a,i)=>a+i.flags.length,0)}</b>flags</div>`;
  $('list').innerHTML = shown.slice(0, 500).map(i => {
    const flags = i.flags.filter(f => (!cat || f.category === cat) && (!sev || f.severity === sev));
    const head = i.status !== 'scored' ? `<span class="tag">${esc(i.status)}</span> ${esc(i.error)}` : (i.flags.length ? '' : '<span class="tag clean">clean</span>');
    const first = flags[0];
    return `<div class="item"><h3>${esc(i.id)} <span class="tag">${esc(i.lang)}</span><span class="tag">quality ${i.quality_score ?? 'n/a'}</span>${head}</h3>
      <div class="text"><span class="muted">source:</span> ${highlight(i.source, first && first.source_span)}</div>
      <div class="text"><span class="muted">translation:</span> ${highlight(i.translation, first && first.span)}</div>
      ${i.back_translation ? `<div class="text muted">back-translation: ${esc(i.back_translation)}</div>` : ''}
      ${i.transcript ? `<div class="text muted">transcript: ${esc(i.transcript)}</div>` : ''}
      ${flags.map(f => `<div class="flag"><span class="tag ${f.severity}">${f.severity}</span><b>${esc(f.category)}</b> confidence ${f.confidence.toFixed(2)}${f.audio_span ? ` audio ${f.audio_span[0].toFixed(1)}-${f.audio_span[1].toFixed(1)}s` : ''}
        <ul>${f.evidence.map(e => `<li>${esc(e)}</li>`).join('')}${f.judge ? `<li class="muted">judge: ${esc(f.judge)}</li>` : ''}</ul></div>`).join('')}
    </div>`;
  }).join('') + (shown.length > 500 ? '<p class="muted">Showing first 500 items.</p>' : '');
}
['lang','cat','sev','status','q'].forEach(id => $(id).addEventListener('input', render));
render();
</script></body></html>

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indic-task-compiler"
version = "0.1.0"
description = "Plan-checked, injection-proof MCP tool server and task agent for Bodhan.ai Indic models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "openai==3.57.0",
    "httpx==0.28.1",
    "pydantic==2.14.4",
    "pypdfium2==5.15.2",
    "Pillow==12.3.0",
    "python-dotenv==1.2.4",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bodhan_mcp = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

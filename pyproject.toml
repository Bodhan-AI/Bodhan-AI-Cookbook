# Tooling config for the validation scripts and tests only. Recipes manage their own dependencies.
[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["examples", "getting-started", "integrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
